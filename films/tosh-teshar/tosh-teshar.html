/* Film brief
Subject and beat: "Tomchi tomib, tosh teshar" (Uzbek proverb: dripping water
  pierces stone). A seed lies under a heavy stone. Drop after drop falls from a
  leaf onto the stone. The same water soaks down and wakes the seed. The shoot
  hits the stone and pushes; the stone does not move. Each drop lengthens a
  crack. When the crack reaches the bottom, a thread of light enters the dark;
  the shoot finds it. A last, heavy drop and one more push: the stone splits,
  light floods in and a red tulip (lola) opens. The proverb writes itself.
Duration 38 s; 9:16; 1080x1920; 24 fps.
Drawing reference: the skill's pencil studies (examples/sketchbook-bird.html).
Looks: pencil + watercolour wash. Mixed media reason: colour IS the light. The
  world is graphite while the seed is in the dark; the first colour is the gold
  thread through the crack; at the split the colour spreads out of the crack.
  What crosses the boundary: the shoot (same drawing), the stone halves, the
  leaf and its drops, the camera move.
Techniques used: whole cels with assisted inbetweens (shoot, leaves, tulip,
  seed), reveal of fixed drawings for growth that happens at a tip (roots,
  crack, lettering), rigid halves for the stone, washes (pigmentWash).
Palette and bindings: graphite on warm paper; paper grain belongs to the
  screen; hatching belongs to each object (stone marks rotate with its halves);
  colour washes belong to the world and to each moving object.
Mark language: long pressure-tapered contours; stone hatching at one hand
  angle, denser on the lower-left, crossed only in the darkest part; soil tone
  darker with depth; light areas stay open.
Hardest action: crack-through -> the shoot turns to the light -> last drop ->
  push -> split. The drop hits on T_SPLIT; the halves open on that frame; the
  shoot rises on ones for 9 frames.
Exposure: 24 fps. Drops, splats, spray, chips and the stone opening on ones;
  shoot, leaves, tulip, seed and lettering on twos; long holds while pressing.
Camera: wide -> down to the seed -> medium for the time-lapse -> tilt up with
  the shoot -> wide for the lettering. A short jolt on the split.
Beat sheet (s): 0 rain stops, first drop 1.8 | 3.2-7 water soaks down |
  6.6 seed breathes, 8 cracks | 8.3-10.8 shoot rises, touches the stone |
  11.8, 13.0 pushes with the drops | 15-19 drops quicken, crack grows |
  19.1 crack through: gold thread | 20-21.8 shoot finds it | 21-22.7 heavy
  drop swells | 23.2 split, light, colour | 25-27 leaves | 26.4-30 tulip |
  32.4-35.2 lettering | 38 end.
Sound: each drop is a note; the time-lapse becomes a run; silence and a
  heartbeat before the split; a low hit and a chord; a rising line as it grows.
Sources: all drawings and lettering are original and code-authored. Engine:
  hand-drawn-canvas-animation skill (MIT, Alexey Fateev).

{

 const t = k/(n - 1), u = 1 - t, w = [u*u*u, 3*u*u*t, 3*u*t*t, t*t*t];

const ring = (c, rx, ry, a0, sweep, n, tilt = 0) => Array.from({length: n}, (_, k) => {

}

  const tone = clamp(.2 + .55*(y + 165)/390 + .32*(-x/290) + .3*Math.max(0, Math.hypot(x - 80, y + 80)/260 - .5), 0, .95);
