<!doctype html>
<meta charset="utf-8">
<title>Pochtam — tezkor promo (30 s)</title>
<style>body{margin:0;background:#101126;display:grid;place-items:center;min-height:100vh}canvas{max-width:100vw;max-height:100vh;object-fit:contain}.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;padding:6px 10px;background:#161616ee;color:#ddd;font:12px ui-monospace,monospace}.bar input{flex:1}</style>
<canvas id="c"></canvas>
<script src="core.js"></script>
<script src="brand-assets.js"></script>
<script src="screens.js"></script>
<script>
'use strict';
/* Film brief
Client: Pochtam (pochtam.uz), the app for buying from foreign stores. A 30-second
  promo for Reels / TikTok / Telegram, remade from scratch: fast cuts, a hook in
  the first second, the current app (captured from NShakhobiddin/Pochtachi as of
  5 Oct 2026 with mocked AI and rates: nothing reached the live Worker).
Edit grid: 120 BPM, a beat every 0.5 s (12 frames), a bar every 2 s. Every cut
  lands on a beat or a half-beat, so a track generated at 120 BPM lines up
  (the music prompt in the README follows the same timeline).
Beats (s): 0 hook: the sneaker, "Xitoyda — ¥699" | 1 "Uyingizgacha qanchaga
  tushadi?" | 2 "Boj? Kargo? Kurs? Kuryer?" on eighths | 3 "Javob — bitta
  skrinshotda", shutter | 4 DROP: the logo | 5 photo search | 7 screenshot ->
  total ($102.20, an example) | 9 what the price is made of, duty $0 within the
  limit | 11 the whole cart in one count | 13 couriers, a courier buys for you |
  15 step-by-step guides | 17 tracking | 19 numbers: 43 stores, 20 couriers,
  7 guides, $200 a month duty-free, AI, 3 languages | 22 "Hammasi — bitta
  ilovada" | 24 DROP 2: the parcel at the door | 26 the brand intro | 28
  pochtam.uz | 30 end.
Look: Pochtam's own colours (blue #1A1FB0, lime #bbef45, navy, pale lilac), its
  typeface Onest and its logo pieces; full-bleed colour fields, big kinetic
  type, the real screens in a phone with camera push-ins, taps, viewfinder brackets
  and shutter flashes. Numbers come from the app's own formulas with test
  rates (1 USD = 12 650 so'm), so the totals are marked as an example.
Sound: the film is cut for an external track (see the prompt); the preview
  score here is synthesized on the same grid, pitched sounds only.
*/
{
// ------------------------------------------------------------------ brand
const BLUE = '#1A1FB0', BLUE2 = '#3B40E8', NAVY = '#131429', LIME = '#bbef45', PALE = '#E9EAFD', WHITE = '#ffffff', RED = '#ff3b1f', INK = '#4E4F6B';
const RANGES = {latin: 'U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212',
 'latin-ext': 'U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+1E00-1E9F, U+20A0-20AB, U+2C60-2C7F, U+A720-A7FF',
 cyrillic: 'U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116', 'cyrillic-ext': 'U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F'};
for (const [k, url] of Object.entries(BRAND_FONT)) { const ff = new FontFace('Onest', `url(${url})`, {weight: '400 800', unicodeRange: RANGES[k]}); document.fonts.add(ff); _photoLoads.push(ff.load()); }
_photoLoads.push(document.fonts.load('800 40px Onest'), document.fonts.load('600 40px Onest'), document.fonts.load('800 40px Onest', 'Ўзбекча Русский ¥'));
const IMG = {}, SCR = {};
for (const [k, src] of Object.entries(BRAND_IMG)) { const im = new Image(); im.src = src; IMG[k] = im; _photoLoads.push(im.decode()); }
for (const [k, src] of Object.entries(SCREENS)) { const im = new Image(); im.src = src; SCR[k] = im; _photoLoads.push(im.decode()); }
const uz = s => String(s).replace(/([oOgG])'/g, '$1ʻ').replace(/'/g, 'ʼ');

const FPS = 24, END = 30, BEAT = .5, DEG = Math.PI/180;
const span = (t, a, b, e = x => x) => e(clamp((t - a)/(b - a), 0, 1));
const outBack = (t, s = 1.70158) => 1 + (s + 1)*Math.pow(t - 1, 3) + s*Math.pow(t - 1, 2);
const outExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10*t);
const inOutQuart = t => t < .5 ? 8*t*t*t*t : 1 - Math.pow(-2*t + 2, 4)/2;
const outElastic = t => { const c4 = 2*Math.PI/3; return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10*t)*Math.sin((t*10 - .75)*c4) + 1; };
function text(c, s, x, y, {size = 80, w = 800, color = NAVY, align = 'center', alpha = 1, sc = 1, rot = 0, spacing = -.02, shadow = 0} = {}) {
  if (alpha <= 0 || sc <= 0) return; c.save(); c.globalAlpha *= alpha; c.translate(x, y); c.rotate(rot); c.scale(sc, sc);
  c.font = `${w} ${size}px Onest`; c.textAlign = align; c.textBaseline = 'alphabetic'; c.letterSpacing = (spacing*size).toFixed(1) + 'px';
  if (shadow) { c.shadowColor = 'rgba(10,12,60,.35)'; c.shadowBlur = shadow; c.shadowOffsetY = shadow*.35; }
  c.fillStyle = color; c.fillText(uz(s), 0, 0); c.restore();
}
const tw = (c, s, size, w = 800, spacing = -.02) => { c.save(); c.font = `${w} ${size}px Onest`; c.letterSpacing = (spacing*size).toFixed(1) + 'px'; const m = c.measureText(uz(s)).width; c.restore(); return m; };
// a word slammed in on its beat: big and a little turned, then settled
const slam = (t, t0, d = .16) => { const u = span(t, t0, t0 + d); return {sc: u <= 0 ? 0 : lerp(1.55, 1, outBack(u, 2.2)), alpha: span(t, t0, t0 + .05), rot: (1 - outExpo(u))*-6*DEG}; };
function marker(c, x, y, w, h, color, u) { if (u <= 0) return; c.save(); c.fillStyle = color; c.beginPath(); c.roundRect(x, y, w*u, h, h*.18); c.fill(); c.restore(); }
function dots(c, color, a = .12, step = 54) { c.save(); c.fillStyle = color; c.globalAlpha = a; for (let y = step/2; y < H; y += step) for (let x = step/2; x < W; x += step) { c.beginPath(); c.arc(x, y, 3, 0, TAU); c.fill(); } c.restore(); }
function fill(c, color) { c.fillStyle = color; c.fillRect(0, 0, W, H); }
function flash(c, t, t0, d = .14, color = '255,255,255', peak = 1) { const u = span(t, t0, t0 + d); if (t < t0 || u >= 1) return; c.save(); c.fillStyle = `rgba(${color},${peak*(1 - u)})`; c.fillRect(0, 0, W, H); c.restore(); }
// small shakes on the hits, decaying fast
const HITS = [0, 1.5, 2, 2.25, 2.5, 2.75, 3.5, 4, 5, 7, 7.45, 8, 9, 10, 11, 11.45, 13, 15, 17, 19, 19.5, 20, 20.5, 21, 21.5, 22, 24, 26.3, 28];
function shakeAt(t) { let x = 0, y = 0; for (const h of HITS) { const d = t - h; if (d < 0 || d > .2) continue; const a = 14*(1 - d/.2); x += a*Math.sin(d*90 + h); y += a*Math.cos(d*77 + h*2); } return [x, y]; }

// ------------------------------------------------------------------ props: the sneaker, the price tag, the phone, the parcel
const SNK = ['M-150 18 C-158 -10 -150 -44 -120 -64 C-96 -72 -70 -62 -60 -52 C-50 -84 -20 -96 4 -62 C40 -38 92 -16 138 2 C156 10 162 20 156 28 L60 28 L-60 26 Z',
  'M-150 18 L-60 26 L60 28 L156 28 C168 34 162 50 150 50 L70 56 L-60 56 L-154 48 Z', 'M-40 -64 L-8 -72 M-28 -48 L8 -58 M-14 -32 L24 -42 M2 -18 L40 -28', 'M-120 -8 C-70 -24 10 -10 70 6'].map(d => new Path2D(d));
function sneaker(c, x, y, s, rot = 0, stripe = RED) {
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s); c.lineJoin = 'round'; c.lineCap = 'round';
  c.save(); c.globalAlpha = .18; c.fillStyle = NAVY; c.beginPath(); c.ellipse(0, 70, 150, 16, 0, 0, TAU); c.fill(); c.restore();
  c.fillStyle = '#eef2f7'; c.fill(SNK[0]); c.fillStyle = WHITE; c.fill(SNK[1]); c.strokeStyle = '#1b1b2a'; c.lineWidth = 5; c.stroke(SNK[0]); c.stroke(SNK[1]); c.stroke(SNK[2]);
  c.strokeStyle = stripe; c.lineWidth = 9; c.stroke(SNK[3]); c.restore();
}
function priceTag(c, x, y, rot, s, label) {
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
  c.strokeStyle = NAVY; c.lineWidth = 4; c.beginPath(); c.moveTo(0, -150); c.lineTo(0, -40); c.stroke();
  c.fillStyle = RED; c.beginPath(); c.moveTo(-120, -40); c.lineTo(120, -40); c.lineTo(120, 70); c.lineTo(0, 120); c.lineTo(-120, 70); c.closePath(); c.fill();
  c.fillStyle = WHITE; c.beginPath(); c.arc(0, -16, 9, 0, TAU); c.fill();
  text(c, label, 0, 56, {size: 78, color: WHITE}); c.restore();
}
const PH = {w: 390, h: 888, bz: 18, r: 58, sb: 44};                                                 // the app's 844 px under a 44 px status bar
function phone(c, cx, cy, s, rot, draw, {alpha = 1, blur = 0} = {}) {
  c.save(); c.globalAlpha = alpha; c.translate(cx, cy); c.rotate(rot); c.scale(s, s);
  const W2 = PH.w + 2*PH.bz, H2 = PH.h + 2*PH.bz;
  c.save(); c.shadowColor = 'rgba(10,12,60,.45)'; c.shadowBlur = 60; c.shadowOffsetY = 26; c.fillStyle = '#0d0e1c'; c.beginPath(); c.roundRect(-W2/2, -H2/2, W2, H2, PH.r + PH.bz); c.fill(); c.restore();
  c.strokeStyle = '#2b2d48'; c.lineWidth = 3; c.beginPath(); c.roundRect(-W2/2 + 1.5, -H2/2 + 1.5, W2 - 3, H2 - 3, PH.r + PH.bz); c.stroke();
  c.save(); c.beginPath(); c.roundRect(-PH.w/2, -PH.h/2, PH.w, PH.h, PH.r); c.clip(); c.translate(-PH.w/2, -PH.h/2); c.fillStyle = '#F1F1F8'; c.fillRect(0, 0, PH.w, PH.h); c.translate(0, PH.sb); draw(c); c.restore();
  c.fillStyle = '#0d0e1c'; c.beginPath(); c.roundRect(-52, -PH.h/2 + 10, 104, 28, 14); c.fill();
  c.restore();
}
// a screen inside the phone (CSS px), under a status bar in the colour of the screen's top edge
const TOPC = {};
function topColor(k) { if (!TOPC[k]) { const cv = document.createElement('canvas'); cv.width = cv.height = 1; const x = cv.getContext('2d'); x.drawImage(SCR[k], 6, 6, 1, 1, 0, 0, 1, 1); const d = x.getImageData(0, 0, 1, 1).data; TOPC[k] = `rgb(${d[0]},${d[1]},${d[2]})`; } return TOPC[k]; }
function scr(c, k, a = 1) { if (a <= 0) return; c.save(); c.globalAlpha *= a; c.fillStyle = topColor(k); c.fillRect(0, -PH.sb, 390, PH.sb + 2); c.drawImage(SCR[k], 0, 0, 390, 844);
  c.fillStyle = '#0d0e1c'; c.font = '700 16px Onest'; c.textAlign = 'left'; c.fillText('9:41', 34, -14);
  [5, 8, 11, 14].forEach((h, i) => c.fillRect(300 + i*5, -14 - h, 3.4, h)); c.lineWidth = 1.6; c.strokeStyle = '#0d0e1c'; c.beginPath(); c.roundRect(328, -27, 25, 13, 4); c.stroke(); c.fillRect(330.5, -24.5, 18, 8); c.fillRect(354.5, -23, 2, 5);
  c.restore(); }
function tap(c, x, y, t, t0) { const pre = span(t, t0 - .2, t0)*(1 - span(t, t0 + .05, t0 + .2)), u = span(t, t0, t0 + .4, outExpo);
  if (pre > 0) { c.save(); c.globalAlpha = .6*pre; c.fillStyle = WHITE; c.beginPath(); c.arc(x, y, 18, 0, TAU); c.fill(); c.lineWidth = 3; c.strokeStyle = BLUE; c.stroke(); c.restore(); }
  if (u > 0 && u < 1) { c.save(); c.globalAlpha = .8*(1 - u); c.lineWidth = 4; c.strokeStyle = LIME; c.beginPath(); c.arc(x, y, 14 + 40*u, 0, TAU); c.stroke(); c.restore(); } }
function hi(c, b, t, t0, {color = LIME, w = 5, pad = 6} = {}) { const u = span(t, t0, t0 + .18, outExpo); if (u <= 0) return; const [x, y, ww, hh] = b;
  c.save(); c.strokeStyle = color; c.lineWidth = w; c.globalAlpha = Math.min(1, u*1.4); const sx = x - pad - 12*(1 - u), sy = y - pad - 8*(1 - u); c.beginPath(); c.roundRect(sx, sy, ww + 2*pad + 24*(1 - u), hh + 2*pad + 16*(1 - u), 14); c.stroke(); c.restore(); }
// viewfinder brackets closing on a rectangle (screen space)
function brackets(c, x, y, w, h, u, color = LIME) { if (u <= 0) return; const e = outExpo(u), g = 70*(1 - e), L = Math.min(w, h)*.22;
  c.save(); c.strokeStyle = color; c.lineWidth = 12; c.lineCap = 'round'; c.globalAlpha = Math.min(1, u*2);
  for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { const px = x + w/2 + sx*(w/2 + g), py = y + h/2 + sy*(h/2 + g); c.beginPath(); c.moveTo(px - sx*L*-0 , py - sy*L); c.lineTo(px, py); c.lineTo(px - sx*L, py); c.stroke(); }
  c.restore(); }
function parcel(c, x, y, s, rot = 0, sq = 0) {
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s*(1 + sq), s*(1 - sq));
  c.save(); c.globalAlpha = .22; c.fillStyle = NAVY; c.beginPath(); c.ellipse(0, 150, 230, 26, 0, 0, TAU); c.fill(); c.restore();
  c.fillStyle = '#d8a86a'; c.beginPath(); c.moveTo(-200, -60); c.lineTo(200, -60); c.lineTo(200, 150); c.lineTo(-200, 150); c.closePath(); c.fill();
  c.fillStyle = '#e6be8a'; c.beginPath(); c.moveTo(-200, -60); c.lineTo(-150, -130); c.lineTo(250, -130); c.lineTo(200, -60); c.closePath(); c.fill();
  c.fillStyle = '#c48f52'; c.beginPath(); c.moveTo(200, -60); c.lineTo(250, -130); c.lineTo(250, 80); c.lineTo(200, 150); c.closePath(); c.fill();
  c.fillStyle = LIME; c.fillRect(-30, -60, 60, 210); c.beginPath(); c.moveTo(-30, -60); c.lineTo(20, -130); c.lineTo(80, -130); c.lineTo(30, -60); c.closePath(); c.fill();
  c.drawImage(IMG.p, -160, -20, 70, 70*IMG.p.height/IMG.p.width); text(c, 'pochtam', 110, 110, {size: 30, color: '#7a5326', w: 700});
  c.restore();
}

// ------------------------------------------------------------------ the brand intro, ported from the app (1080x1920 stage)
const HEX = (cx, cy, R) => Array.from({length: 6}, (_, k) => { const a = -Math.PI/2 + k*Math.PI/3; return [cx + R*Math.cos(a), cy + R*Math.sin(a)]; });
const MS = .62, MW = 765*MS, MH = 835*MS, MARK = {x: (1080 - MW)/2, y: 470, w: MW, h: MH};
const PSZ = {w: 295*MS, h: 482*MS}, PC = {x: MARK.x + (410 + 147.5)*MS, y: MARK.y + (274 + 241)*MS}, WS = .40;
const GLYPHS = [{k: 'P', x: 897, w: 206}, {k: 'o', x: 1123, w: 214}, {k: 'c', x: 1361, w: 198}, {k: 'h', x: 1585, w: 194}, {k: 't', x: 1804, w: 134}, {k: 'a', x: 1966, w: 218}, {k: 'm', x: 2228, w: 303}, {k: 'dot', x: 2567, w: 52}];
const WORD_W = (2619 - 897)*WS, WORD_X = (1080 - WORD_W)/2, WORD_Y = MARK.y + MH + 80, WORD_H = 288*WS;
const TAG = {x: WORD_X, y: WORD_Y + WORD_H + 34, w: WORD_W, h: 96*WS}, HEX_C = {x: MARK.x + 382.5*MS, y: MARK.y + 417.5*MS};
const an = (from, to, s, e, ease = easeOut) => T0 => from + (to - from)*ease(clamp((T0 - s)/(e - s), 0, 1));
const ILAND = .3, WORD_CUE = 1.0;
const IA = { u: an(0, 1, 0, ILAND, x => x*x*x), landS: an(.86, 1, ILAND, ILAND + .5, outBack), pOp: an(0, 1, 0, .15),
 ringS: an(1, 1.6, ILAND, ILAND + .8), ringOp: an(1, 0, ILAND, ILAND + .7), hexOp: an(0, 1, ILAND - .06, ILAND + .1), hexS: an(.86, 1, ILAND - .04, ILAND + .55, outBack),
 gX: an(-260, WORD_W + 260, WORD_CUE + .45, WORD_CUE + 1.15, inOutQuart), gOpA: an(0, 1, WORD_CUE + .45, WORD_CUE + .6), gOpB: an(1, 0, WORD_CUE + .95, WORD_CUE + 1.2),
 tagCut: an(100, 0, WORD_CUE + .6, WORD_CUE + 1.2, inOutQuart), tagOp: an(0, 1, WORD_CUE + .6, WORD_CUE + .72) };
function brandMark(c, T0, {word = true, tag = true} = {}) {
  const ro = IA.ringOp(T0);
  if (ro > 0 && T0 > ILAND) { c.save(); c.translate(HEX_C.x, HEX_C.y); c.scale(IA.ringS(T0), IA.ringS(T0)); c.globalAlpha = ro; c.strokeStyle = LIME; c.lineWidth = 12; c.lineJoin = 'round'; c.beginPath(); HEX(0, 0, 431*MS).forEach((q, i) => i ? c.lineTo(...q) : c.moveTo(...q)); c.closePath(); c.stroke(); c.restore(); }
  const hs = IA.hexS(T0); c.save(); c.globalAlpha = IA.hexOp(T0); c.translate(MARK.x + MARK.w/2, MARK.y + MARK.h/2); c.scale(hs, hs); c.drawImage(IMG.hex, -MARK.w/2, -MARK.h/2, MARK.w, MARK.h); c.restore();
  if (word) GLYPHS.forEach((g, i) => { const st = WORD_CUE + i*.05, dy = an(60, 0, st, st + (g.k === 'dot' ? .8 : .5), g.k === 'dot' ? outElastic : outBack)(T0), op = an(0, 1, st, st + .15)(T0);
    if (op > 0) { c.save(); c.globalAlpha = op; c.drawImage(IMG[g.k], WORD_X + (g.x - 897)*WS, WORD_Y + dy, g.w*WS, WORD_H); c.restore(); } });
  const gl = IA.gOpA(T0)*IA.gOpB(T0);
  if (word && gl > 0) { c.save(); c.beginPath(); c.rect(WORD_X, WORD_Y - 12, WORD_W, WORD_H + 24); c.clip(); c.globalCompositeOperation = 'screen'; c.globalAlpha = gl; c.translate(WORD_X + IA.gX(T0), WORD_Y - 40); c.transform(1, 0, Math.tan(-14*DEG), 1, 0, 0); const gg = c.createLinearGradient(0, 0, 140, 0); gg.addColorStop(0, 'rgba(255,255,255,0)'); gg.addColorStop(.5, 'rgba(255,255,255,.85)'); gg.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = gg; c.fillRect(0, 0, 140, WORD_H + 100); c.restore(); }
  const cut = IA.tagCut(T0), to = IA.tagOp(T0);
  if (word && tag && to > 0) { c.save(); c.globalAlpha = to; c.beginPath(); c.rect(TAG.x, TAG.y - TAG.h*.14, TAG.w*(1 - cut/100), TAG.h*1.28); c.clip(); c.drawImage(IMG.tagline, TAG.x, TAG.y, TAG.w, TAG.h); c.restore(); }
  const u = IA.u(T0), pS = u < 1 ? lerp(.7, .86, u) : IA.landS(T0), sq = Math.sin(Math.PI*clamp((T0 - ILAND)/.34, 0, 1))*.15;
  c.save(); c.globalAlpha = IA.pOp(T0); c.translate(PC.x, PC.y - 520*(1 - u)); c.rotate(-14*DEG*(1 - u)); c.scale(pS*(1 + sq), pS*(1 - sq)); c.drawImage(IMG.p, -PSZ.w/2, -PSZ.h/2, PSZ.w, PSZ.h); c.restore();
}

// ------------------------------------------------------------------ shots (each gets the global time; cuts on the 120 BPM grid)
const B = SCREEN_BOXES, cen = b => [b[0] + b[2]/2, b[1] + b[3]/2];
function caption(c, t, t0, lines, {y = 250, color = NAVY, mark = LIME, size = 96} = {}) {
  lines.forEach(([s, hl], i) => { const st = slam(t, t0 + i*.12), w = tw(c, s, size);
    if (hl && st.alpha > 0) { c.save(); c.translate(540, y + i*size*1.08); c.rotate(st.rot); c.scale(st.sc, st.sc); marker(c, -w/2 - 22, -size*.82, w + 44, size*1.02, mark, span(t, t0 + i*.12 + .05, t0 + i*.12 + .25, outExpo)); c.restore(); }
    text(c, s, 540, y + i*size*1.08, {size, color, ...st}); });
}
const PHONE = {x: 540, y: 1170, s: 1.36};
function featurePhone(c, t, t0, draw, {s = PHONE.s, x = PHONE.x, y = PHONE.y, zoom = 1, fy = 422} = {}) {
  const k = span(t, t0, t0 + .22, outExpo), dx = (1 - k)*900;                                   // whips in from the right on the bar
  const Y = y + (fy + PH.sb - PH.h/2)*s; c.save(); c.translate(x, Y); c.scale(zoom, zoom); c.translate(-x, -Y);   // the camera pushes in on a point of the screen
  if (k < 1) { for (let j = 3; j >= 1; j--) phone(c, x + dx + j*60*(1 - k), y, s, (1 - k)*6*DEG, draw, {alpha: .18*(1 - k)}); }
  phone(c, x + dx, y + 8*Math.sin(t*2.2), s*(1 + .015*Math.sin(t*1.7)), (1 - k)*6*DEG, draw); c.restore();
}
function bgFeature(c, color = PALE, dot = BLUE) { fill(c, color); dots(c, dot, .1); }
const SHOTS = [
  // ---- the hook
  [0, 1, (c, t) => { fill(c, WHITE); dots(c, BLUE, .08); const z = 1 + .06*t; c.save(); c.translate(540, 1000); c.scale(z, z); c.translate(-540, -1000);
    const k = span(t, -.1, .16, outExpo); sneaker(c, 520 + 700*(1 - k), 1060, 2.7, (-14 + 8*k)*DEG);          // the very first frame is already full
    const sw = span(t, .2, 1.0), ang = Math.exp(-4*sw)*Math.sin(sw*16)*22*DEG; if (t > .2) priceTag(c, 760, 690 + 160*(1 - span(t, .2, .35, outBack)), ang, 1.25, '¥699'); c.restore();
    const st = slam(t, -.08); text(c, 'Xitoyda', 540, 430, {size: 150, color: NAVY, ...st}); const s2 = slam(t, .5); text(c, 'shu narxda', 540, 560, {size: 92, w: 700, color: INK, ...s2}); }],

// ------------------------------------------------------------------ the frame
function frame(c, tau) {
  const t = Math.round(tau*FPS)/FPS; resetT(c);
  const [sx, sy] = shakeAt(t); c.save(); c.translate(sx, sy); c.translate(540, 960); c.scale(1.02, 1.02); c.translate(-540, -960);       // a little overscan, so a shake never shows an edge
  const s = SHOTS.find(([a, b]) => t >= a && t < b) || SHOTS[SHOTS.length - 1]; s[2](c, t);
  c.restore();
}
