<script>
'use strict';
/* Film brief
Occasion: Ustoz va murabbiylar kuni. A second greeting from a student to his
  teacher Dilshod Bahodirovich Mannopov, built on the teacher's photo (supplied
  by the student; kept out of the public repository).
Story "Qalam": the student draws his teacher in pencil. Guide lines first, then
  the eyes ("they were the first to believe in me"), the face, the hair, the
  steepled hands ("you taught me not what to think, but how to think"), the
  shirt. When the drawing is done a small light kindles between the hands; its
  sparks fly out and become doodles around the portrait (bulb, book, star,
  heart, paper plane, clay lamp) and a watercolour wash spreads from it. The
  teacher's words "Qalbingga quloq sol!" are written in under it and
  underlined. The greeting follows.
Look: a graphite portrait on warm paper, made the way a person draws one. The
  photo's background is dropped (flood fill from the border). Tone becomes
  three sheets of real hatching strokes on a right hand's slant, added as the
  tone deepens, plus soft blended graphite on the face; light skin stays paper.
  A line layer (each pixel against its neighbourhood, dodge-style) holds the
  features. Everything catches on the paper's tooth. The shirt is loose
  contour strokes (traced from the figure's outline) and a few hatched folds,
  and the drawing thins out into the paper below the shoulders: a vignette
  sketch, not a cut-out. It is revealed by narrow strokes along the hatching
  slant in the order a person draws; contours and lines lead, shading follows.
  A dark green 2B pencil with a cast shadow works where the lines appear and
  lifts between passes. The camera starts close on the eyes and pulls back as
  the drawing grows. Colour arrives only with the light: the wash and the
  doodles (ink over watercolour).
Format: 9:16, 1080x1920, 24 fps, 58 s. Captions in the upper band; the closing
  card holds 10 s.
Sound: synthesized here, pitched sounds only (the student asked for no hiss):
  piano and music box in G major, 72 BPM; soft notes as each part of the
  portrait starts, a bell for the light, a ping for each doodle.
Engine: hand-drawn-canvas-animation skill (MIT, Alexey Fateev).
*/
{
// ------------------------------------------------------------------ look

  light: [31.6, 33.4], sparks0: 35.4, sparkGap: .75, fly: .6, draw: .8,
  quote: [41.6, 45.2], move: [45.0, 47.0], card: 46.6, end: 58.0,

const CAPS = [[[0.8, 4.6], "Sizni qalamda chizmoqchi bo'ldim…"], [[5.0, 8.6], "Qayerdan boshlashni bilmadim."],
  [[9.0, 14.4], "Ko'zlaringizdan boshladim — ular menga birinchi bo'lib ishongan edi."], [[14.8, 19.6], "Har bir chizgi — bir xotira, bir saboq."],
  [[20.0, 26.4], "Keyin qo'llaringiz… Siz menga nima o'ylashni emas, qanday o'ylashni o'rgatdingiz."],
  [[26.8, 31.0], "Chizib bo'lgach, bir narsani angladim:"], [[31.4, 36.0], "qo'llaringizda doim bir yorug'lik bo'lgan ekan."],
  [[36.4, 41.2], "Siz uni hammamizga ulashdingiz."]];

// ------------------------------------------------------------------ the portrait (photo → pencil drawing)
const PX = {sx: 190, sy: 30, sw: 900, sh: 994}, PS = 1020/900, PW = 1020, PH = Math.round(994*PS);
const toP = ([x, y]) => [(x - PX.sx)*PS, (y - PX.sy)*PS];                          // photo px → portrait-local
const toPh = ([x, y]) => [PX.sx + x/PS, PX.sy + y/PS];
const EYES = [[590, 293], [690, 290]], TIPS = [680, 435], LIGHT = [680, 575];
const HANDS = [[680, 425], [620, 450], [540, 540], [450, 650], [440, 725], [520, 735], [610, 650], [680, 600], [750, 650], [840, 735], [905, 705], [860, 600], [790, 510], [720, 440]];
const HATCH = -52*DEG;                                                              // a right hand's natural hatching slant
const ss = (a, b, x) => { const u = clamp((x - a)/(b - a), 0, 1); return u*u*(3 - 2*u); };

  const h = (a, b) => hash(Math.imul(a, 73856093) ^ Math.imul(b, 19349663), seed); return lerp(lerp(h(xi, yi), h(xi + 1, yi), u), lerp(h(xi, yi + 1), h(xi + 1, yi + 1), u), v); }

// when each part of the drawing arrives: eyes, face, hair, neck, hands, body
function appearAt(ph, h) {
  const [x, y] = ph, dEye = Math.min(...EYES.map(e => Math.hypot(x - e[0], y - e[1])));

// how finished each place is: the face and hands fully, the shirt looser, and the drawing thins out into

function finishAt(ph) {

const PORT = {ready: false};

    if (u > 0 && u < 1) { const mid = [(L[0] + d.at[0])/2, Math.min(L[1], d.at[1]) - 160]; for (let j = 0; j < 4; j++) { const v = Math.max(0, u - j*.07);
      const p = [0, 1].map(i => (1 - v)**2*[L, mid, d.at][0][i] + 2*v*(1 - v)*mid[i] + v*v*d.at[i]); glow(c, p[0], p[1], 34 - j*6, 1 - j*.2); } }
    const dr = span(t, s0 + T.fly, s0 + T.fly + T.draw, easeInOutSine); if (dr <= 0) return;
    c.save(); c.translate(...d.at);
    for (const [pts, col, al] of d.fill) { const p = pathOf(jit(pts, 1.6, 7 + k)); c.save(); c.globalAlpha = al*span(dr, .45, 1); c.globalCompositeOperation = 'multiply'; c.translate(4, 5);
      c.fillStyle = col; c.fill(p); c.globalAlpha *= .5; c.strokeStyle = col; c.lineWidth = 3; c.stroke(p); c.restore(); }
    reveal(c, cel('doodle-' + d.id, d.make), dr, SEPIA, 'ink');
    if (d.flame) { const fa = span(t, s0 + T.fly + T.draw*.8, s0 + T.fly + T.draw + .3); glow(c, d.flame[0], d.flame[1] - 8, 60, .8*fa); flame(c, d.flame[0], d.flame[1], 22, t, 9, fa); }
    c.restore();
  });
  c.restore();
  resetT(c);
  drawPencil(c, pencilAt(t, gtip), t, pencilLift(t));
  captions(c, t); card(c, t);
  const f = 1 - span(t, T.fade[0], T.fade[1]); if (f > 0) { c.save(); c.globalAlpha = f; c.fillStyle = '#1a1714'; c.fillRect(0, 0, W, H); c.restore(); }
}

// ------------------------------------------------------------------ score (G major, 72 BPM; synthesized, pitched sounds only)
const BPM = 72, BEAT = 60/BPM, BAR = 4*BEAT, mtof = m => 440*Math.pow(2, (m - 69)/12);
const CHORDS = [[43, 55, 59, 62, 67], [40, 52, 59, 64, 67], [36, 55, 60, 64, 67], [38, 54, 57, 62, 66],        // G Em C D (drawing begins)
  [43, 55, 59, 62, 67], [42, 54, 57, 62, 66], [40, 52, 59, 64, 67], [36, 55, 60, 64, 67],                          // G D/F# Em C
  [47, 55, 59, 62, 67], [36, 55, 60, 64, 67], [45, 57, 60, 64, 69], [38, 54, 57, 62, 66],                          // G/B C Am D
  [36, 55, 60, 64, 67], [38, 54, 57, 62, 66], [40, 52, 59, 64, 67], [36, 55, 60, 64, 67], [43, 55, 59, 62, 67]];   // C D Em C G
const MELODY = [[4, 0, 71, 2], [4, 2, 74, 2], [5, 0, 69, 3], [5, 3, 74, 1], [6, 0, 67, 2], [6, 2, 71, 2], [7, 0, 76, 3], [7, 3, 74, 1],
  [8, 0, 74, 2], [8, 2, 71, 2], [9, 0, 72, 2], [9, 2, 76, 2], [10, 0, 76, 2], [10, 2, 72, 1], [10, 3, 69, 1], [11, 0, 74, 4],
  [14, 0, 79, 2], [14, 2, 76, 2], [15, 0, 76, 2], [15, 2, 74, 1], [15, 3, 72, 1], [16, 0, 79, 4]];
function score(ac, t0, dest) {
  const G = (v, d) => { const g = ac.createGain(); g.gain.value = v; if (d) g.connect(d); return g; };
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 2; comp.knee.value = 10; comp.attack.value = .01; comp.release.value = .3;
  const master = G(.9, dest); comp.connect(master);
  const len = Math.ceil(ac.sampleRate*2.6), ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch), r = rng(ch + 23); for (let i = 0; i < len; i++) d[i] = (r()*2 - 1)*Math.pow(1 - i/len, 3.4); }
  const room = ac.createConvolver(); room.buffer = ir; const rlp = ac.createBiquadFilter(); rlp.type = 'lowpass'; rlp.frequency.value = 3200; room.connect(rlp); rlp.connect(G(1, comp));
  const bus = G(1, comp); bus.connect(G(.34, room));
  const env = (p, t, a, peak, d) => { p.setValueAtTime(0, t); p.linearRampToValueAtTime(peak, t + a); p.exponentialRampToValueAtTime(.0001, t + a + d); p.setValueAtTime(0, t + a + d + .01); };
  const osc = (f, t, a, peak, d, dst, type = 'sine') => { const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; env(g.gain, t, a, peak, d); o.connect(g); g.connect(dst); o.start(t); o.stop(t + a + d + .05); };
  const piano = (m, t, v, d = null) => { const f = mtof(m), dur = d ?? clamp(3.4 - (m - 40)*.045, 1.2, 3.4);
    [[1, 1], [2, .42], [3, .18], [4, .08]].forEach(([h, a]) => osc(f*h*(1 + (h - 1)*.0007), t, .005, v*a, dur/Math.pow(h, .7), bus)); };
  const box = (m, t, v) => { const f = mtof(m); osc(f, t, .003, v, 1.3, bus); osc(f*3.01, t, .002, v*.18, .35, bus); };
  const bell = (m, t, v, d = 1.8) => { const f = mtof(m), c = ac.createOscillator(), mo = ac.createOscillator(), mg = ac.createGain(), g = ac.createGain();
    c.frequency.value = f; mo.frequency.value = f*2; mg.gain.setValueAtTime(f*.8, t); mg.gain.exponentialRampToValueAtTime(f*.02, t + d*.7); mo.connect(mg); mg.connect(c.frequency);
    env(g.gain, t, .004, v, d); c.connect(g); g.connect(bus); c.start(t); mo.start(t); c.stop(t + d + .1); mo.stop(t + d + .1); };
  const padBus = G(1); const plp = ac.createBiquadFilter(); plp.type = 'lowpass'; plp.frequency.value = 950; padBus.connect(plp); plp.connect(bus);
  const pad = (ch, t, d, v) => ch.slice(1).forEach(m => [-6, 6].forEach(det => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 1.1); g.gain.setValueAtTime(v, t + d); g.gain.linearRampToValueAtTime(0, t + d + 1.6); o.connect(g); g.connect(padBus); o.start(t); o.stop(t + d + 1.7); }));
  const total = T.end;
  CHORDS.forEach((ch, b) => {
    const tb = t0 + b*BAR; if (b*BAR > total - .5) return;
    const last = b === CHORDS.length - 1, hold = last ? total - b*BAR - 1.6 : BAR;
    pad(ch, tb, hold, b < 4 ? .007 : .008);
    if (b < 2) { piano(ch[0], tb, .08, 3.2); piano(ch[2], tb + BEAT*2, .045, 2.6); return; }
    if (b < 4) { [0, 2, 3, 4].forEach((j, i) => piano(ch[j], tb + i*BEAT, .05)); return; }                                  // quarter-note arpeggio while the guides go down
    if (last) { ch.forEach((m, i) => piano(m, tb + i*.11, .08 - i*.007, 4.2)); return; }
    const calm = b >= 12, pat = [0, 1, 2, 3, 4, 3, 2, 1];
    piano(ch[0], tb, .085);
    for (let i = 1; i < 8; i++) { if (calm && i % 2) continue; piano(ch[1 + (pat[i] % 4)], tb + i*BEAT/2, .036*(i % 2 ? .8 : 1)); }
  });
  MELODY.forEach(([b, beat, m, n]) => { const t = t0 + b*BAR + beat*BEAT; piano(m, t, .1, Math.max(1.6, n*BEAT*1.3)); box(m + 12, t, .011); });
  // each part of the drawing begins: eyes, face, hair, hands, the body
  [[7.8, 83], [9.8, 79], [13.0, 81], [19.0, 86], [23.8, 83]].forEach(([t, m]) => box(m, t0 + t, .03));
  bell(83, t0 + T.light[0], .05, 2.4); bell(86, t0 + T.light[0] + .1, .03, 2.4);                      // the light
  DOODLES.forEach((d, k) => box([79, 81, 83, 86, 88, 91][k], t0 + sparkT(k) + T.fly, .03));           // each doodle lands
  bell(79, t0 + T.quote[0], .03, 2.2);
}

defineFilm({palette: {...PALETTES.pencilMinimal, paper: PAPER}, format: {ar: '9:16', width: 1080}, fps: 24, timeline: [{name: 'portret', dur: T.end, fn: shot}], score});
}
