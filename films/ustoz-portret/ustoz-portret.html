<script>
'use strict';
/* Film brief
Occasion: Ustoz va murabbiylar kuni. A second greeting from Shaxobiddin to his
  teacher Dilshod Bahodirovich Mannopov, built on the teacher's photo (supplied
  by the student; kept out of the public repository).
Story "Qalam": the student draws his teacher in pencil. Guide lines first, then
  the eyes ("they were the first to believe in me"), the face, the hair, the
  steepled hands ("you taught me not what to think, but how to think"), the
  shirt. When the drawing is done a small light kindles between the hands; its
  sparks fly out and become doodles around the portrait (bulb, book, star,
  heart, paper plane, clay lamp). The teacher's words "Qalbingga quloq sol!"
  are written under it and the student signs. The greeting follows.
Look: graphite on warm paper. The photo becomes a drawing in the page: a line
  layer (each pixel against its neighbourhood, dodge-style) and a hatched shade
  layer, graphite-coloured, with paper grain. The background of the photo is
  dropped (flood fill from the border) so only the teacher is drawn. The
  drawing is revealed by pencil-width strokes in the order a person would draw
  it; lines lead, shading follows a second later; a drawn pencil works where
  the lines are appearing. Colour arrives only with the light and the doodles.
Format: 9:16, 1080x1920, 24 fps, 58 s. Captions in the upper band; the closing
  card holds 10 s.
Sound: synthesized here, pitched sounds only (the student asked for no hiss):
  piano and music box in G major, 72 BPM; soft notes as each part of the
  portrait starts, a bell for the light, a ping for each doodle.
Engine: hand-drawn-canvas-animation skill (MIT, Alexey Fateev).
*/
{
// ------------------------------------------------------------------ look
const PAPER = '#f3eada', GRAPHITE = '#2c2724', INKC = '#3a312b', SEPIA = '#7a4a1e', AMBER = '#9a5a14', GOLD = '#e0a33a';
const uz = s => String(s).replace(/([oOgG])'/g, '$1ʻ').replace(/'/g, 'ʼ');
for (const f of FILM_FONTS) { const ff = new FontFace(f.family, `url(${f.src})`, {weight: f.weight, style: f.style, unicodeRange: f.range}); document.fonts.add(ff); _photoLoads.push(ff.load()); }

const FPS = 24, DEG = Math.PI/180;
const span = (t, a, b, e = x => x) => e(clamp((t - a)/(b - a), 0, 1));

const lp2 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
const PRESS = [[0, .15], [.15, .85], [.5, 1], [.85, .8], [1, .1]];
const CELS = {};
const cel = (id, make) => CELS[id] ??= compileCel({strokes: make().map((s, k) => ({id: s.id ?? `s${k}`, points: s.pts, width: s.w ?? 4, opacity: s.o ?? 1, pressure: PRESS}))}, {id});
const pathOf = (pts, close = true) => { const p = new Path2D(); pts.forEach((q, i) => i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1])); if (close) p.closePath(); return p; };

function densify(pts, step, close) { const out = [], P = close ? [...pts, pts[0]] : pts;
  for (let i = 0; i < P.length - 1; i++) { const a = P[i], b = P[i + 1], n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1])/step)); for (let k = 0; k < n; k++) out.push(lp2(a, b, k/n)); }

const loop = (pts, amp = 1, seed = 1, step = 10) => { const d = jit(densify(pts, step, true), amp, seed); return [...d, ...d.slice(0, 3)]; };

// a fixed cel drawn up to u (pencil or ink), plus where the hand is at u
function reveal(c, compiled, u, color, material = 'pencil') {
  if (u <= 0) return null; if (u >= 1) { drawCel(c, compiled, {material, color}); return null; }
  c.save(); c.lineCap = material === 'pencil' ? 'butt' : 'round'; c.strokeStyle = color; let tip = null;

      for (let i = 1; i <= last; i++) {

}
function text(c, str, x, y, {size = 52, font = 'italic 400', fam = 'Literata', color = INKC, align = 'center', alpha = 1} = {}) {
  if (alpha <= 0) return;
  c.save(); c.font = `${font} ${size}px ${fam}`; c.textAlign = align; c.textBaseline = 'alphabetic'; c.globalAlpha *= alpha; c.letterSpacing = fam === 'Fraunces' ? (-.01*size).toFixed(1) + 'px' : '0px';

}
function wrap(c, str, size, maxW, font = 'italic 400', fam = 'Literata') {
  c.save(); c.font = `${font} ${size}px ${fam}`; const out = []; let cur = '';
  for (const w of uz(str).split(' ')) { const t = cur ? cur + ' ' + w : w; if (cur && c.measureText(t).width > maxW) { out.push(cur); cur = w; } else cur = t; }
  if (cur) out.push(cur); c.restore(); return out;
}

// ------------------------------------------------------------------ timing (seconds)
const T = {
  fade: [0, 1.2], pencilIn: [1.0, 3.0], guide: [3.2, 8.2], lead: 1.0, reveal1: 30.0, pencilOut: [30.2, 31.4],
  light: [31.6, 33.4], sparks0: 35.4, sparkGap: .75, fly: .6, draw: .8,
  quote: [41.6, 45.2], sign: 43.0, move: [45.0, 47.0], card: 46.6, end: 58.0,
};
const CAPS = [[[0.8, 4.6], "Sizni qalamda chizmoqchi bo'ldim…"], [[5.0, 8.6], "Qayerdan boshlashni bilmadim."],
  [[9.0, 14.4], "Ko'zlaringizdan boshladim — ular menga birinchi bo'lib ishongan edi."], [[14.8, 19.6], "Har bir chizgi — bir xotira, bir saboq."],
  [[20.0, 26.4], "Keyin qo'llaringiz… Siz menga nima o'ylashni emas, qanday o'ylashni o'rgatdingiz."],
  [[26.8, 31.0], "Chizib bo'lgach, bir narsani angladim:"], [[31.4, 36.0], "qo'llaringizda doim bir yorug'lik bo'lgan ekan."],
  [[36.4, 41.2], "Siz uni hammamizga ulashdingiz."]];

// ------------------------------------------------------------------ the portrait (photo → pencil)
const PX = {sx: 190, sy: 30, sw: 900, sh: 994}, PS = 1020/900, PW = 1020, PH = Math.round(994*PS);
const toP = ([x, y]) => [(x - PX.sx)*PS, (y - PX.sy)*PS];                          // photo px → portrait-local
const toPh = ([x, y]) => [PX.sx + x/PS, PX.sy + y/PS];
const EYES = [[590, 293], [690, 290]], TIPS = [680, 435], LIGHT = [680, 575];
const HANDS = [[680, 425], [620, 450], [540, 540], [450, 650], [440, 725], [520, 735], [610, 650], [680, 600], [750, 650], [840, 735], [905, 705], [860, 600], [790, 510], [720, 440]];
function inPoly(p, poly) { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > p[1]) !== (yj > p[1]) && p[0] < (xj - xi)*(p[1] - yi)/(yj - yi) + xi) c = !c; } return c; }
// when each part of the drawing arrives: eyes, face, hair, neck, hands, body
function appearAt(ph, h) {
  const [x, y] = ph, dEye = Math.min(...EYES.map(e => Math.hypot(x - e[0], y - e[1])));
  let t;
  if (((x - 640)/165)**2 + ((y - 320)/205)**2 < 1 && y > 200) t = 8.8 + Math.min(1, dEye/200)*5.2;
  else if (y < 260 && x > 460 && x < 820) t = 14.0 + (260 - y)/200*2.6 + Math.abs(x - 640)/180*1.4;
  else if (inPoly(ph, HANDS)) t = 20.0 + Math.min(1, Math.hypot(x - TIPS[0], y - TIPS[1])/330)*4.6;
  else if (y < 500 && x > 470 && x < 820) t = 17.6 + (y - 380)/120*1.6;
  else t = 24.8 + Math.min(1, Math.hypot(x - 680, (y - 620)*1.2)/560)*4.4;
  return t + (h - .5)*.7;
}
const PORT = {ready: false};

    for (let y = 0; y < h; y++) { let s = 0; const row = y*w; for (let x = -r; x <= r; x++) s += a[row + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) { b[row + x] = s/(2*r + 1); s += a[row + Math.min(w - 1, x + r + 1)] - a[row + Math.max(0, x - r)]; } }
    for (let x = 0; x < w; x++) { let s = 0; for (let y = -r; y <= r; y++) s += b[clamp(y, 0, h - 1)*w + x];
      for (let y = 0; y < h; y++) { a[y*w + x] = s/(2*r + 1); s += b[Math.min(h - 1, y + r + 1)*w + x] - b[Math.max(0, y - r)*w + x]; } }
  }

}
function buildPortrait(img) {
  const cv = document.createElement('canvas'); cv.width = PW; cv.height = PH; const g = cv.getContext('2d', {willReadFrequently: true});
  g.drawImage(img, PX.sx, PX.sy, PX.sw, PX.sh, 0, 0, PW, PH);
  const d = g.getImageData(0, 0, PW, PH).data, N = PW*PH, L = new Float32Array(N);
  for (let i = 0; i < N; i++) L[i] = (.299*d[4*i] + .587*d[4*i + 1] + .114*d[4*i + 2])/255;

  for (let x = 0; x < PW; x++) { push(x); push((PH - 1)*PW + x); } for (let y = 0; y < PH; y++) { push(y*PW); push(y*PW + PW - 1); }
  while (st.length) { const i = st.pop(), x = i % PW, y = (i/PW) | 0; if (x > 0) push(i - 1); if (x < PW - 1) push(i + 1); if (y > 0) push(i - PW); if (y < PH - 1) push(i + PW); }
  const fg = new Float32Array(N); for (let i = 0; i < N; i++) fg[i] = bg[i] ? 0 : 1;
  boxBlur(fg, PW, PH, 3, 2);
  const blurL = boxBlur(Float32Array.from(L), PW, PH, 9, 3);

  PORT.lines = mk(lines); PORT.shade = mk(shade);

{ const img = new Image(); img.src = PORTRAIT_PHOTO; _photoLoads.push(img.decode().then(() => buildPortrait(img))); }
const LAST = () => PORT.strokes[PORT.strokes.length - 1].t;
function portraitLayer(c, layer, t) {
  if (t >= LAST() + .3) { c.drawImage(layer, 0, 0); return; }
  const m = PORT.mask.getContext('2d'); m.clearRect(0, 0, PW, PH); m.strokeStyle = '#fff'; m.lineCap = 'round';
  for (const s of PORT.strokes) { if (s.t > t) break; const g = span(t, s.t, s.t + .28, easeOut), dx = Math.cos(s.a)*s.len/2, dy = Math.sin(s.a)*s.len/2;
    m.lineWidth = s.w*(.4 + .6*g); m.beginPath(); m.moveTo(s.x - dx, s.y - dy); m.lineTo(s.x - dx + 2*dx*g, s.y - dy + 2*dy*g); m.stroke(); }

// guide lines the student blocks in first (portrait-local)
const guideCel = () => cel('guide', () => {
  const P = p => toP(p), head = ring([640, 300], 158, 212, -Math.PI/2, TAU*1.02, 44).map(P);
  return [{id: 'head', pts: line(head, 1.2, 3, 12), w: 3.2}, {id: 'axis', pts: line([[640, 110], [648, 520]].map(P), .8, 4), w: 2.6},
    {id: 'eyes', pts: line([[520, 292], [770, 288]].map(P), .8, 5), w: 2.6}, {id: 'shoulders', pts: line([[300, 470], [470, 405], [820, 405], [990, 470]].map(P), 1, 6, 12), w: 3},
    {id: 'handL', pts: line([[680, 438], [460, 700]].map(P), 1, 7), w: 2.8}, {id: 'handR', pts: line([[682, 438], [880, 700]].map(P), 1, 8), w: 2.8},
    {id: 'table', pts: line([[240, 960], [1060, 960]].map(P), 1, 9, 14), w: 2.6}];

// ------------------------------------------------------------------ the pencil (drawn, held at a working angle)
const pencilCel = () => cel('pencil', () => [
  {id: 'body', pts: loop([[26, -250], [46, -238], [46, -40], [26, -22], [6, -40], [6, -238]], .6, 60, 12), w: 3.4},
  {id: 'facet', pts: line([[26, -250], [26, -22]], .5, 61, 12), w: 2.2},
  {id: 'wood', pts: line([[6, -40], [26, 18], [46, -40]], .4, 62, 6), w: 3},
  {id: 'ferrule', pts: loop([[4, -262], [48, -262], [48, -240], [4, -240]], .3, 63, 8), w: 3},
]);
function pencilAt(t) {
  const P0 = [1180, 1700];
  if (t < T.pencilIn[0]) return null;
  if (t < T.guide[0]) { const u = span(t, T.pencilIn[0], T.pencilIn[1], easeOutQuint), g = toScreenP(0, toP([500, 110])); return lp2(P0, g, u); }

    const wig = Math.sin(t*31)*14*span(t, T.guide[1], T.guide[1] + .4), a = -.78;                   // hatching back and forth
    return toScreenP(t, [p[0] + Math.cos(a)*wig, p[1] + Math.sin(a)*wig]); }

  if (!tip) return;
  c.save(); c.translate(tip[0], tip[1]); c.rotate(58*DEG); c.translate(-26, -18);           // held low, so it stays clear of the captions
  c.save(); c.globalAlpha = .12; c.fillStyle = '#000'; c.translate(10, 14); c.fill(pathOf([[6, -238], [46, -238], [46, -40], [26, 18], [6, -40]])); c.restore();
  c.fillStyle = '#e9b949'; c.fill(pathOf([[6, -238], [46, -238], [46, -40], [6, -40]]));
  c.fillStyle = '#d99f2e'; c.fill(pathOf([[26, -238], [46, -238], [46, -40], [26, -40]]));
  c.fillStyle = '#ecd0a4'; c.fill(pathOf([[6, -40], [46, -40], [26, 18]]));
  c.fillStyle = GRAPHITE; c.fill(pathOf([[18, -4], [34, -4], [26, 18]]));
  c.fillStyle = '#b9b3aa'; c.fill(pathOf([[4, -262], [48, -262], [48, -240], [4, -240]]));
  c.fillStyle = '#e48a86'; c.fill(pathOf([[6, -290], [46, -290], [46, -262], [6, -262]]));
  drawCel(c, pencilCel(), {material: 'pencil', color: GRAPHITE});
  c.restore();
}

// ------------------------------------------------------------------ light and doodles
function glow(c, x, y, r, a, mode = 'lighter', col = [255, 214, 150]) {
  if (a <= 0) return; const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${col},${.6*a})`); g.addColorStop(.4, `rgba(${col},${.2*a})`); g.addColorStop(1, `rgba(${col},0)`);

}
function flame(c, x, y, h, t, seed, a = 1) {

}
const LAMP = [[-44, -22], [-26, -28], [0, -30], [26, -28], [44, -22], [58, -16], [74, -12], [92, -16], [104, -22], [108, -18], [104, -12], [90, -6], [72, 0], [58, 8],
  [52, 20], [36, 32], [14, 38], [-14, 38], [-36, 32], [-54, 18], [-60, 0], [-54, -14]];
const star = (c, R, r) => Array.from({length: 10}, (_, k) => { const a = -Math.PI/2 + k*Math.PI/5, q = k % 2 ? r : R; return [c[0] + q*Math.cos(a), c[1] + q*Math.sin(a)]; });
const heart = (c, s) => Array.from({length: 40}, (_, k) => { const a = k/40*TAU; return [c[0] + s*16*Math.pow(Math.sin(a), 3)/16, c[1] - s*(13*Math.cos(a) - 5*Math.cos(2*a) - 2*Math.cos(3*a) - Math.cos(4*a))/16]; });
// portrait-local positions, all on the paper around the figure
const DOODLES = [
  {id: 'bulb', at: [118, 205], fill: [[ring([0, -10], 34, 36, 0, TAU, 25).slice(0, -1), GOLD, .55]],
    make: () => [{id: 'glass', pts: loop([...ring([0, -10], 34, 36, Math.PI*.8, Math.PI*1.4, 16), [16, 30], [-16, 30]], .6, 70), w: 3.4},
      {id: 'base1', pts: line([[-15, 38], [15, 38]], .3, 71), w: 3}, {id: 'base2', pts: line([[-12, 46], [12, 46]], .3, 72), w: 3},
      {id: 'fil', pts: line([[-8, 26], [-8, 0], [-3, -8], [3, 0], [8, -8], [8, 26]], .3, 73, 5), w: 2.4},
      ...[0, 1, 2, 3, 4].map(k => { const a = -Math.PI*(.15 + .175*k); return {id: 'ray' + k, pts: line([[54*Math.cos(a), -10 + 54*Math.sin(a)], [72*Math.cos(a), -10 + 72*Math.sin(a)]], .2, 74 + k, 4), w: 2.6}; })]},
  {id: 'book', at: [895, 225], fill: [[[[-62, -20], [0, -8], [62, -20], [62, 28], [0, 40], [-62, 28]], '#f7e2b8', .9]],
    make: () => [{id: 'l', pts: loop([[-62, -20], [-30, -26], [0, -8], [0, 40], [-30, 26], [-62, 28]], .5, 80, 8), w: 3.4},
      {id: 'r', pts: loop([[62, -20], [30, -26], [0, -8], [0, 40], [30, 26], [62, 28]], .5, 81, 8), w: 3.4},
      ...[0, 1, 2].map(k => ({id: 'tx' + k, pts: line([[-50, -6 + k*11], [-12, 2 + k*11]], .3, 82 + k, 6), w: 2})),
      ...[0, 1, 2].map(k => ({id: 'ty' + k, pts: line([[12, 2 + k*11], [50, -6 + k*11]], .3, 85 + k, 6), w: 2}))]},
  {id: 'star', at: [72, 470], fill: [[star([0, 0], 38, 16), GOLD, .75]], make: () => [{id: 's', pts: loop(star([0, 0], 38, 16), .5, 90, 8), w: 3.2},
      {id: 's2', pts: loop(star([-40, 58], 14, 6), .3, 91, 5), w: 2.4}, {id: 's3', pts: loop(star([28, -54], 11, 5), .3, 92, 5), w: 2.2}]},
  {id: 'heart', at: [958, 480], fill: [[heart([0, 0], 44), '#d9624a', .6]], make: () => [{id: 'h', pts: loop(heart([0, 0], 44), .4, 95, 8), w: 3.4}]},
  {id: 'plane', at: [905, 52], fill: [[[[-44, 6], [40, -22], [-6, 20]], '#fbf1dd', .9]],
    make: () => [{id: 'p', pts: loop([[-44, 6], [40, -22], [-6, 20], [-12, 36], [-18, 14]], .4, 100, 8), w: 3.2}, {id: 'fold', pts: line([[40, -22], [-18, 14]], .3, 101), w: 2.4},
      {id: 'trail', pts: line(Array.from({length: 18}, (_, k) => [-60 - k*14, 16 + 16*Math.sin(k*.5)]), .4, 102, 6), w: 2.2, o: .7}]},
  {id: 'lamp', at: [118, 58], fill: [[LAMP.map(([x, y]) => [x*.55, y*.55]), '#c8743e', .8]], flame: [106*.55, -21*.55],
    make: () => [{id: 'b', pts: loop(LAMP.map(([x, y]) => [x*.55, y*.55]), .4, 105, 6), w: 3.2}, {id: 'h', pts: line([[-30, -7], [-40, -13], [-49, -9], [-48, 2], [-40, 8], [-31, 5]], .3, 106, 4), w: 3}]},
];
const sparkT = k => T.sparks0 + k*T.sparkGap;

// ------------------------------------------------------------------ layout over time
const STORY = {x: 30, y: 380, s: 1}, FINAL = {x: (1080 - PW*.64)/2, y: 150, s: .64};
function place(t) { const u = span(t, T.move[0], T.move[1], easeInOutSine); return {x: lerp(STORY.x, FINAL.x, u), y: lerp(STORY.y, FINAL.y, u), s: lerp(1, FINAL.s, u)}; }
const toScreenP = (t, p) => { const P = place(t); return [P.x + p[0]*P.s, P.y + p[1]*P.s]; };

function paperBg(c) {
  paper(c, PAPER, null, 11); resetT(c);
  const v = c.createRadialGradient(W/2, H*.46, H*.25, W/2, H*.5, H*.8); v.addColorStop(0, 'rgba(120,90,60,0)'); v.addColorStop(1, 'rgba(120,90,60,.22)');
  c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = v; c.fillRect(0, 0, W, H); c.restore();
}
function captions(c, t) {
  for (const [[a, b], s] of CAPS) { const al = win(t, a, b); if (al <= 0) continue;
    const lines = wrap(c, s, 50, 930), y0 = 272 - (lines.length - 1)*33 + 12*(1 - span(t, a, a + .9, easeOut));
    lines.forEach((l, i) => text(c, l, W/2, y0 + i*66, {size: 50, alpha: al})); }
}
function card(c, t) {
  const q = win(t, T.quote[0], 99, .8), P = place(t), qy = P.y + PH*P.s + (t < T.move[0] ? 80 : 58);
  text(c, "«Qalbingga quloq sol!»", W/2, qy, {size: t < T.move[0] ? 48 : 38, color: SEPIA, alpha: q});
  if (t < T.move[0] + .6) { const sa = span(t, T.sign, T.sign + .8)*(1 - span(t, T.move[0], T.move[0] + .6));
    text(c, "Shaxobiddin, 2026", P.x + PW*P.s - 24, qy + 64, {size: 32, color: GRAPHITE, align: 'right', alpha: sa}); }
  if (t < T.card) return;
  const a = k => span(t, T.card + k, T.card + k + 1.1, easeOut), up = k => 16*(1 - a(k));
  text(c, 'Aziz Ustozim,', W/2, 1010 + up(0), {size: 54, alpha: a(0)});
  text(c, 'Dilshod Bahodirovich', W/2, 1100 + up(.8), {size: 66, font: '600', fam: 'Fraunces', color: AMBER, alpha: a(.8)});
  text(c, 'Mannopov!', W/2, 1174 + up(1.2), {size: 66, font: '600', fam: 'Fraunces', color: AMBER, alpha: a(1.2)});
  text(c, 'Ustoz va murabbiylar kuni', W/2, 1274 + up(2.6), {size: 50, font: '600', fam: 'Fraunces', color: GRAPHITE, alpha: a(2.6)});
  text(c, "muborak bo'lsin!", W/2, 1334 + up(3), {size: 50, font: '600', fam: 'Fraunces', color: GRAPHITE, alpha: a(3)});
  wrap(c, "Siz chizib bergan yo'ldan yurib, bugun o'zim ham chizishni o'rgandim. Rahmat, Ustoz!", 38, 880).forEach((l, i) => text(c, l, W/2, 1420 + i*50 + up(4.6), {size: 38, color: '#4a3f36', alpha: a(4.6)}));
  text(c, 'Minnatdor shogirdingiz,', W/2, 1590 + up(6.6), {size: 40, color: AMBER, alpha: a(6.6)});
  text(c, 'Shaxobiddin', W/2, 1654 + up(7.2), {size: 54, color: AMBER, alpha: a(7.2)});
}

// ------------------------------------------------------------------ the frame
function shot(c, tau) {
  const t = Math.round(tau*FPS)/FPS, P = place(t);
  paperBg(c);
  c.save(); c.translate(P.x, P.y); c.scale(P.s, P.s);
  // guide lines, then the drawing itself: lines lead, shading follows
  const ga = Math.max(0, 1 - .8*span(t, 13, 19) - .2*span(t, 22, 27));   // clamp: canvas ignores a negative alpha                                  // the guides are rubbed out as the drawing takes over
  let tip = null;
  if (t > T.guide[0] && ga > .005) { c.save(); c.globalAlpha = ga; const gt = reveal(c, guideCel(), span(t, T.guide[0], T.guide[1], easeInOutSine), '#8b8176'); c.restore(); if (t < T.guide[1]) tip = gt; }
  if (PORT.ready && t > 7.2) { portraitLayer(c, PORT.shade, t); portraitLayer(c, PORT.lines, t + T.lead); }
  // the light between his hands
  const L = toP(LIGHT), la = span(t, T.light[0], T.light[1], easeOut);
  if (la > 0) { glow(c, L[0], L[1] - 20, 460, .38*la, 'multiply', [255, 196, 120]); glow(c, L[0], L[1] - 20, 190, .55*la); flame(c, L[0], L[1] + 16, 52, t, 5, la); glow(c, L[0], L[1] - 6, 60, .8*la); }
  // sparks become doodles
  DOODLES.forEach((d, k) => {
    const s0 = sparkT(k), u = span(t, s0, s0 + T.fly, easeInOutSine);
    if (u > 0 && u < 1) { const mid = [(L[0] + d.at[0])/2, Math.min(L[1], d.at[1]) - 160]; for (let j = 0; j < 4; j++) { const v = Math.max(0, u - j*.07);
      const p = [0, 1].map(i => (1 - v)**2*[L, mid, d.at][0][i] + 2*v*(1 - v)*mid[i] + v*v*d.at[i]); glow(c, p[0], p[1], 34 - j*6, 1 - j*.2); } }
    const dr = span(t, s0 + T.fly, s0 + T.fly + T.draw, easeInOutSine); if (dr <= 0) return;
    c.save(); c.translate(...d.at);
    for (const [pts, col, al] of d.fill) { c.save(); c.globalAlpha = al*span(dr, .5, 1); c.fillStyle = col; c.translate(3, 4); c.fill(pathOf(pts)); c.restore(); }
    reveal(c, cel('doodle-' + d.id, d.make), dr, SEPIA, 'ink');
    if (d.flame) { const fa = span(t, s0 + T.fly + T.draw*.8, s0 + T.fly + T.draw + .3); glow(c, d.flame[0], d.flame[1] - 8, 60, .8*fa); flame(c, d.flame[0], d.flame[1], 22, t, 9, fa); }
    c.restore();
  });
  c.restore();
  resetT(c);
  if (!tip) tip = pencilAt(t); else tip = toScreenP(t, tip);
  drawPencil(c, tip, t);
  captions(c, t); card(c, t);
  const f = 1 - span(t, T.fade[0], T.fade[1]); if (f > 0) { c.save(); c.globalAlpha = f; c.fillStyle = '#1a1714'; c.fillRect(0, 0, W, H); c.restore(); }
}

// ------------------------------------------------------------------ score (G major, 72 BPM; synthesized, pitched sounds only)
const BPM = 72, BEAT = 60/BPM, BAR = 4*BEAT, mtof = m => 440*Math.pow(2, (m - 69)/12);
const CHORDS = [[43, 55, 59, 62, 67], [40, 52, 59, 64, 67], [36, 55, 60, 64, 67], [38, 54, 57, 62, 66],        // G Em C D (drawing begins)
  [43, 55, 59, 62, 67], [42, 54, 57, 62, 66], [40, 52, 59, 64, 67], [36, 55, 60, 64, 67],                          // G D/F# Em C
  [47, 55, 59, 62, 67], [36, 55, 60, 64, 67], [45, 57, 60, 64, 69], [38, 54, 57, 62, 66],                          // G/B C Am D
  [36, 55, 60, 64, 67], [38, 54, 57, 62, 66], [40, 52, 59, 64, 67], [36, 55, 60, 64, 67], [43, 55, 59, 62, 67]];   // C D Em C G
const MELODY = [[4, 0, 71, 2], [4, 2, 74, 2], [5, 0, 69, 3], [5, 3, 74, 1], [6, 0, 67, 2], [6, 2, 71, 2], [7, 0, 76, 3], [7, 3, 74, 1],
  [8, 0, 74, 2], [8, 2, 71, 2], [9, 0, 72, 2], [9, 2, 76, 2], [10, 0, 76, 2], [10, 2, 72, 1], [10, 3, 69, 1], [11, 0, 74, 4],
  [14, 0, 79, 2], [14, 2, 76, 2], [15, 0, 76, 2], [15, 2, 74, 1], [15, 3, 72, 1], [16, 0, 79, 4]];
function score(ac, t0, dest) {
  const G = (v, d) => { const g = ac.createGain(); g.gain.value = v; if (d) g.connect(d); return g; };
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 2; comp.knee.value = 10; comp.attack.value = .01; comp.release.value = .3;
  const master = G(.9, dest); comp.connect(master);
  const len = Math.ceil(ac.sampleRate*2.6), ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch), r = rng(ch + 23); for (let i = 0; i < len; i++) d[i] = (r()*2 - 1)*Math.pow(1 - i/len, 3.4); }
  const room = ac.createConvolver(); room.buffer = ir; const rlp = ac.createBiquadFilter(); rlp.type = 'lowpass'; rlp.frequency.value = 3200; room.connect(rlp); rlp.connect(G(1, comp));
  const bus = G(1, comp); bus.connect(G(.34, room));
  const env = (p, t, a, peak, d) => { p.setValueAtTime(0, t); p.linearRampToValueAtTime(peak, t + a); p.exponentialRampToValueAtTime(.0001, t + a + d); p.setValueAtTime(0, t + a + d + .01); };
  const osc = (f, t, a, peak, d, dst, type = 'sine') => { const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; env(g.gain, t, a, peak, d); o.connect(g); g.connect(dst); o.start(t); o.stop(t + a + d + .05); };
  const piano = (m, t, v, d = null) => { const f = mtof(m), dur = d ?? clamp(3.4 - (m - 40)*.045, 1.2, 3.4);
    [[1, 1], [2, .42], [3, .18], [4, .08]].forEach(([h, a]) => osc(f*h*(1 + (h - 1)*.0007), t, .005, v*a, dur/Math.pow(h, .7), bus)); };
  const box = (m, t, v) => { const f = mtof(m); osc(f, t, .003, v, 1.3, bus); osc(f*3.01, t, .002, v*.18, .35, bus); };
  const bell = (m, t, v, d = 1.8) => { const f = mtof(m), c = ac.createOscillator(), mo = ac.createOscillator(), mg = ac.createGain(), g = ac.createGain();
    c.frequency.value = f; mo.frequency.value = f*2; mg.gain.setValueAtTime(f*.8, t); mg.gain.exponentialRampToValueAtTime(f*.02, t + d*.7); mo.connect(mg); mg.connect(c.frequency);
    env(g.gain, t, .004, v, d); c.connect(g); g.connect(bus); c.start(t); mo.start(t); c.stop(t + d + .1); mo.stop(t + d + .1); };
  const padBus = G(1); const plp = ac.createBiquadFilter(); plp.type = 'lowpass'; plp.frequency.value = 950; padBus.connect(plp); plp.connect(bus);
  const pad = (ch, t, d, v) => ch.slice(1).forEach(m => [-6, 6].forEach(det => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 1.1); g.gain.setValueAtTime(v, t + d); g.gain.linearRampToValueAtTime(0, t + d + 1.6); o.connect(g); g.connect(padBus); o.start(t); o.stop(t + d + 1.7); }));
  const total = T.end;
  CHORDS.forEach((ch, b) => {
    const tb = t0 + b*BAR; if (b*BAR > total - .5) return;
    const last = b === CHORDS.length - 1, hold = last ? total - b*BAR - 1.6 : BAR;
    pad(ch, tb, hold, b < 4 ? .007 : .008);
    if (b < 2) { piano(ch[0], tb, .08, 3.2); piano(ch[2], tb + BEAT*2, .045, 2.6); return; }
    if (b < 4) { [0, 2, 3, 4].forEach((j, i) => piano(ch[j], tb + i*BEAT, .05)); return; }                                  // quarter-note arpeggio while the guides go down
    if (last) { ch.forEach((m, i) => piano(m, tb + i*.11, .08 - i*.007, 4.2)); return; }
    const calm = b >= 12, pat = [0, 1, 2, 3, 4, 3, 2, 1];
    piano(ch[0], tb, .085);
    for (let i = 1; i < 8; i++) { if (calm && i % 2) continue; piano(ch[1 + (pat[i] % 4)], tb + i*BEAT/2, .036*(i % 2 ? .8 : 1)); }
  });
  MELODY.forEach(([b, beat, m, n]) => { const t = t0 + b*BAR + beat*BEAT; piano(m, t, .1, Math.max(1.6, n*BEAT*1.3)); box(m + 12, t, .011); });
  // each part of the drawing begins: eyes, face, hair, hands, the body
  [[7.8, 83], [9.8, 79], [13.0, 81], [19.0, 86], [23.8, 83]].forEach(([t, m]) => box(m, t0 + t, .03));
  bell(83, t0 + T.light[0], .05, 2.4); bell(86, t0 + T.light[0] + .1, .03, 2.4);                      // the light
  DOODLES.forEach((d, k) => box([79, 81, 83, 86, 88, 91][k], t0 + sparkT(k) + T.fly, .03));           // each doodle lands
  bell(79, t0 + T.quote[0], .03, 2.2); box(86, t0 + T.sign + .2, .02);
}

defineFilm({palette: {...PALETTES.pencilMinimal, paper: PAPER}, format: {ar: '9:16', width: 1080}, fps: 24, timeline: [{name: 'portret', dur: T.end, fn: shot}], score});
}
