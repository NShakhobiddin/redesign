<!doctype html>
<meta charset="utf-8">
<title>Pochtam — 5 qadam (30 s)</title>
<style>body{margin:0;background:#101126;display:grid;place-items:center;min-height:100vh}canvas{max-width:100vw;max-height:100vh;object-fit:contain}.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;padding:6px 10px;background:#161616ee;color:#ddd;font:12px ui-monospace,monospace}.bar input{flex:1}</style>

<script>
'use strict';
/* Film brief — 30-second cut of pochtam-reklama.html (same drawings, screens
   and brand intro; each step 3.7 s, no "what else" beat, shorter hook).
   Original brief (v2: how it works, in the order a buyer uses it)
Client: Pochtam (pochtam.uz). The app has three tabs — Boshlash, Xaridlarim,
  Ma'lumotnoma — and one path from wish to doorstep. The film walks that path:
  1 find the store (43 stores / AI suggests), 2 upload a screenshot (AI reads
  the price), 3 know the total (cargo, duty, fee, so'm), 4 open the ordering
  guide (11 steps for the store), 5 order yourself or let a courier buy for
  you, then track it in Xaridlarim (Topish → Narx → Buyurtma → Yo'lda → Keldi).
  Then what else is inside (customs, couriers, AI, expert help, 3 languages),
  the parcel at the door, and the app's own brand intro.
Real screens: captured offline from the app (NShakhobiddin/Pochtachi) with the
  smoke test's mocked AI and rates; nothing reached the live Worker. The
  store page being photographed is a generic mock.
Duration 53.8 s; 9:16; 1080x1920; 24 fps. For Reels / Telegram.
Looks: pencil (doubt) -> ink + flat brand colour (clarity), as in v1. Real
  screens sit inside an ink-drawn phone; the drawn layer points at them:
  brush loops, taps, lime tags, a step badge and a five-dot progress line.
Exposure: taps, flashes, slides and drops on ones; loops draw on over 8
  frames; tags pop on ones; captions and screens hold long enough to read.
Beat sheet (s): 0 the dream and the doubts | 6.1 the p lands, colour |
  7.4 "Pochtam bilan — 5 qadam" | 8.9 step 1 | 15.2 step 2 | 21.5 step 3 |
  27.8 step 4 | 34.1 step 5 | 40.4 what else | 43.6 doorstep |
  47.4 iris | 47.9 brand intro | 50.8 pochtam.uz | 53.8 end.
Sources: drawings original; screens are Pochtam's; brand assets Pochtam's.
  Engine: hand-drawn-canvas-animation skill (MIT, Alexey Fateev).
*/
{
// ------------------------------------------------------------------ brand
const BLUE = '#1A1FB0', NAVY = '#131429', LIME = '#bbef45', PALE = '#E9EAFD', PALE2 = '#DCDDFA', BG = '#F1F1F8';
const PAPER = '#f3eee2', GRAPH = '#2e2823', KRAFT = '#d8a86a';
const RANGES = {latin: 'U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212',
 'latin-ext': 'U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+1E00-1E9F, U+20A0-20AB, U+2C60-2C7F, U+A720-A7FF',
 cyrillic: 'U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116', 'cyrillic-ext': 'U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F'};
for (const [k, url] of Object.entries(BRAND_FONT)) { const ff = new FontFace('Onest', `url(${url})`, {weight: '400 800', unicodeRange: RANGES[k]}); document.fonts.add(ff); _photoLoads.push(ff.load()); }
_photoLoads.push(document.fonts.load('800 40px Onest'), document.fonts.load('600 40px Onest'), document.fonts.load('800 40px Onest', 'Ўзбекча Русский'));
const IMG = {};
for (const [k, src] of Object.entries(BRAND_IMG)) { const im = new Image(); im.src = src; IMG[k] = im; _photoLoads.push(im.decode()); }

const FPS = 24, fr = s => Math.round(s*FPS);
const LW = 2.3, PRESS = [[0,.1],[.12,.8],[.4,1],[.73,.65],[1,.05]], DEG = Math.PI/180;
const lp2 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
const span = (t, a, b, e = x => x) => e(clamp((t - a)/(b - a), 0, 1));
const outBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(t - 1, 3) + c1*Math.pow(t - 1, 2); };
const inOutQuart = t => t < .5 ? 8*t*t*t*t : 1 - Math.pow(-2*t + 2, 4)/2;
const outElastic = t => { const c4 = 2*Math.PI/3; return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10*t)*Math.sin((t*10 - .75)*c4) + 1; };
const ring = (c, rx, ry, a0, sweep, n, tilt = 0) => Array.from({length: n}, (_, k) => {
 const a = a0 + sweep*k/(n - 1), x = rx*Math.cos(a), y = ry*Math.sin(a);
 return [c[0] + x*Math.cos(tilt) - y*Math.sin(tilt), c[1] + x*Math.sin(tilt) + y*Math.cos(tilt)];
});
function rrect(cx, cy, w, h, r, per = 5) {
 const pts = [], x0 = cx - w/2, y0 = cy - h/2, x1 = cx + w/2, y1 = cy + h/2;
 const corner = (x, y, a0) => { for (let i = 0; i <= per; i++) { const a = a0 + i/per*Math.PI/2; pts.push([x + r*Math.cos(a), y + r*Math.sin(a)]); } };
 corner(x1 - r, y0 + r, -Math.PI/2); corner(x1 - r, y1 - r, 0); corner(x0 + r, y1 - r, Math.PI/2); corner(x0 + r, y0 + r, Math.PI);
 return pts;
}
const gesture = pts => [...pts, ...pts.slice(0, 3)];           // a closed shape drawn as one overlapping stroke
const pathOf = (pts, close = true) => { const p = new Path2D(); pts.forEach((q, i) => i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1])); if (close) p.closePath(); return p; };
function drawing() { const strokes = []; return {strokes, add(id, points, width = 1.4, opacity = 1, extra = {}) { strokes.push({id, points, width: width*LW, opacity, pressure: PRESS, ...extra}); }}; }
const CELS = {};
const cel = (id, raw) => CELS[id] ??= compileCel(raw, {id});
const pencil = (c, compiled, o = {}) => drawCel(c, compiled, {material: 'pencil', color: GRAPH, ...o});
const ink = (c, compiled, color = NAVY, o = {}) => drawCel(c, compiled, {material: 'ink', color, ...o});
function fill(c, pts, color, alpha = 1, dx = 0, dy = 0) { c.save(); c.globalAlpha *= alpha; c.fillStyle = color; c.translate(dx, dy); c.fill(pathOf(pts)); c.restore(); }
function text(c, str, x, y, {size = 48, weight = 800, color = NAVY, align = 'center', alpha = 1, halo = null} = {}) {
 if (alpha <= 0) return;
 c.save(); c.font = `${weight} ${size}px Onest`; c.textAlign = align; c.textBaseline = 'alphabetic'; c.globalAlpha *= alpha;
 c.letterSpacing = (size >= 34 ? -.035*size : size >= 26 ? -.03*size : -.012*size).toFixed(2) + 'px';
 if (halo) { c.strokeStyle = halo; c.lineWidth = size*.28; c.lineJoin = 'round'; c.strokeText(str, x, y); }
 c.fillStyle = color; c.fillText(str, x, y); c.restore();
}
// A hand-written reveal of a fixed cel: marks identical to drawCel, cut at u.
function pencilPart(c, compiled, u) {
 c.save(); c.lineCap = 'butt'; c.strokeStyle = GRAPH;
 const all = compiled.strokes.reduce((a, s) => a + s.samples.length - 1, 0); let budget = u*all;
 for (const s of compiled.strokes) {
  const last = Math.min(s.samples.length - 1, Math.floor(budget)); budget -= s.samples.length - 1; if (last < 1) break;
  for (let pass = 0; pass < 3; pass++) {
   const spread = (pass - 1)*s.width*.30;
   const pt = a => { const d = (noise1(a.u*5 + pass*11, s.seed)*.20 + spread)*Math.sin(Math.PI*a.u); return [a.p[0] - a.tangent[1]*d, a.p[1] + a.tangent[0]*d]; };
   for (let i = 1; i <= last; i++) {
    const a = s.samples[i - 1], b = s.samples[i], tooth = hash(i*3 + pass, s.seed);
    if (tooth < .08 + .10*(1 - Math.min(1, b.w/s.width))) continue;
    c.lineWidth = Math.max(.18, Math.max(.04, (a.w + b.w)/2)*.40); c.globalAlpha = (s.opacity ?? 1)*(.34 + tooth*.30);
    c.beginPath(); c.moveTo(...pt(a)); c.lineTo(...pt(b)); c.stroke();
   }
  }
 }
 c.restore();
}

// ------------------------------------------------------------------ timing (seconds)
// 30-second cut: the same beats, tighter. The "what else" beat is left out.
const T = {
 draw0: .1, draw1: .8, heart: .85, cap1: .1, capOut: 1.35,
 B: 1.35, bubbles: [1.45, 1.7, 1.95, 2.15, 2.35], tangle0: 1.35, tangle1: 2.9, tremble0: 2.45,
 drop: 2.85, land: 3.1, straight1: 3.6, toLogo0: 3.55, toLogo1: 3.95, cap2: 3.7, press: 99,
 steps0: 4.8, stepDur: 3.7, extra: 23.3,
 arrive: 23.3, open0: 23.85, open1: 24.15, jump0: 24.15, jump1: 24.6, cap3: 24.35,
 iris0: 25.9, iris1: 26.3, url: 28.0, end: 30.0,
};
const stepAt = k => T.steps0 + k*T.stepDur;

// ------------------------------------------------------------------ the dream sneaker
function sneakerRaw() {
 const d = drawing();
 d.add('upper', [[-150, 18], [-156, -14], [-146, -46], [-118, -66], [-86, -68], [-60, -52], [-46, -86], [-14, -92], [4, -62], [40, -38], [92, -16], [138, 2], [160, 20], [156, 28]], 1.6, 1, {corner: 1.2});
 d.add('collar', [[-118, -66], [-100, -44], [-72, -44], [-60, -52]], 1.1, .9);
 d.add('midsole', [[-150, 18], [-60, 26], [60, 28], [156, 28]], 1.2, .9);
 d.add('sole', [[-150, 18], [-154, 48], [-60, 56], [70, 56], [150, 50], [166, 36], [158, 26]], 1.6, 1, {corner: 1.2});
 [[-40, -64, -8, -72], [-28, -48, 8, -58], [-14, -32, 24, -42], [2, -18, 40, -28]].forEach(([a, b, c2, e], k) => d.add('lace/' + k, [[a, b], [lerp(a, c2, .5), lerp(b, e, .5) - 2], [c2, e]], 1, .9));
 d.add('panel', [[-122, -12], [-66, -22], [4, -8], [58, 4]], 1.1, .85);
 d.add('panel/2', [[-116, 4], [-54, -2], [18, 10]], .9, .7);
 d.add('heel', [[-150, -38], [-166, -50], [-162, -26]], 1, .9);
 d.add('toecap', [[96, -12], [118, 8], [124, 26]], .9, .75);
 for (let k = 0; k < 9; k++) { const x = -136 + k*32; d.add('stitch/' + k, [[x, 38 + (k % 2)], [x + 12, 38 + (k % 2)]], .6, .6); }
 return {strokes: d.strokes};
}
const SNEAKER_SOLE = [[-150, 18], [-60, 26], [60, 28], [156, 28], [166, 36], [150, 50], [70, 56], [-60, 56], [-154, 48]];
const SNEAKER_UPPER = [[-150, 18], [-156, -14], [-146, -46], [-118, -66], [-86, -68], [-60, -52], [-46, -86], [-14, -92], [4, -62], [40, -38], [92, -16], [138, 2], [160, 20], [156, 28], [60, 28], [-60, 26]];
function sneaker(c, mode, x, y, s = 1, rot = 0, u = 1) {
 c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
 if (mode === 'ink') {
  fill(c, SNEAKER_UPPER, LIME, 1, 4, 4); fill(c, SNEAKER_SOLE, '#ffffff', 1, 4, 4);
  fill(c, [[-60, -52], [-46, -86], [-14, -92], [4, -62], [-20, -40]], '#a6d83a', 1, 4, 4);
  ink(c, cel('sneaker', sneakerRaw()));
 } else if (u >= 1) pencil(c, cel('sneaker', sneakerRaw()));
 else pencilPart(c, cel('sneaker', sneakerRaw()), u);
 c.restore();
}

// ------------------------------------------------------------------ the phone
const PH = [0, -40], PH_W = 440, PH_H = 860;
const phoneRaw = () => {
 const d = drawing();
 d.add('body', gesture(rrect(PH[0], PH[1], PH_W, PH_H, 64)), 1.8, 1);
 d.add('screen', gesture(rrect(PH[0], PH[1], PH_W - 44, PH_H - 44, 46)), 1, .6);
 d.add('notch', gesture(rrect(PH[0], PH[1] - PH_H/2 + 40, 110, 22, 11, 3)), 1, .8);
 d.add('button', [[PH[0] + PH_W/2 + 3, -330], [PH[0] + PH_W/2 + 3, -250]], 1.4, .8);
 return {strokes: d.strokes};
};
const storePageRaw = () => {
 const d = drawing();
 d.add('search', gesture(rrect(20, -372, 300, 46, 23, 3)), .9, .7);
 [0, 1, 2].forEach(k => d.add('menu/' + k, [[-172, -386 + k*12], [-146, -386 + k*12]], .9, .7));
 d.add('title/1', [[-160, 60], [60, 60]], 1.6, .45); d.add('title/2', [[-160, 88], [-10, 88]], 1.6, .35);
 for (let k = 0; k < 5; k++) d.add('star/' + k, ring([-150 + k*26, 120], 9, 9, -90*DEG, 4*Math.PI*.8, 6), .8, k < 4 ? .8 : .35);
 d.add('buy', gesture(rrect(0, 300, 300, 84, 42)), 1.3, .9);
 return {strokes: d.strokes};
};
function phone(c, mode, t) {
 if (mode === 'ink') {
  fill(c, rrect(PH[0], PH[1], PH_W, PH_H, 64), NAVY, 1, 6, 8);
  fill(c, rrect(PH[0], PH[1], PH_W - 44, PH_H - 44, 46), '#ffffff');
  // The app screen: brand bar with the mark, the sneaker, the total, a lime order button.
  c.save(); c.clip(pathOf(rrect(PH[0], PH[1], PH_W - 44, PH_H - 44, 46)));
  fill(c, [[-220, -470], [220, -470], [220, -330], [-220, -330]], BLUE);
  c.restore();
  if (t >= T.toLogo1) {
   c.drawImage(IMG.hex, -176, -440, 60, 65); c.drawImage(IMG.p, -176 + 60*.54 - 11, -440 + 65*.62 - 17, 22, 36);
  }
  text(c, 'Pochtam', -104, -388, {size: 40, color: '#ffffff', align: 'left'});
  const a0 = T.toLogo1 - .05, pop = k => outBack(span(t, a0 + k*.08, a0 + k*.08 + .3)), fade = k => span(t, a0 + k*.08, a0 + k*.08 + .2);
  if (pop(0) > 0) sneaker(c, 'ink', 0, -170, pop(0));
  text(c, '$89', -170, 60, {size: 56, align: 'left', alpha: fade(1)});
  text(c, 'Jami narx hisoblandi', -170, 104, {size: 26, weight: 600, color: '#4E4F6B', align: 'left', alpha: fade(2)});
  text(c, 'boj: 0 so\'m · kuryer tanlandi', -170, 140, {size: 24, weight: 500, color: '#6B6C85', align: 'left', alpha: fade(2)});
  const press = (t >= T.press && t < T.press + .12 ? .94 : 1)*pop(3);
  if (press > 0) { c.save(); c.translate(0, 300); c.scale(press, press); fill(c, rrect(0, 0, 300, 84, 42), LIME); text(c, 'Buyurtma', 0, 13, {size: 36}); c.restore(); }
  ink(c, cel('phone', phoneRaw()), NAVY);
 } else {
  pencil(c, cel('phone', phoneRaw()));
  pencil(c, cel('storepage', storePageRaw()));
  const u = span(t, T.draw0, T.draw1);
  const fade = t >= T.tremble0 ? .45 : 1;
  c.save(); c.globalAlpha = fade; sneaker(c, 'pencil', 0, -170, 1, 0, u); c.restore();
  text(c, '$89', -170, 176, {size: 44, weight: 700, color: GRAPH, align: 'left', alpha: span(t, 1.6, 2.0)*fade});
  text(c, 'Sotib olish', 0, 312, {size: 32, weight: 600, color: GRAPH, alpha: span(t, 1.8, 2.2)});
  // Want: a small pencil heart pops beside the shoe.
  if (t >= T.heart) {
   const s = outBack(span(t, T.heart, T.heart + .3)), h = drawing();
   h.add('heart', [[0, 10], [-16, -4], [-18, -16], [-10, -24], [0, -18], [10, -24], [18, -16], [16, -4], [0, 10]], 1.3, 1, {corner: .9});
   c.save(); c.translate(150, -270); c.scale(s*1.6, s*1.6); pencil(c, cel('heart', h)); c.restore();
  }
 }
}

// ------------------------------------------------------------------ doubts
const BUBBLES = [
 {text: 'Qaysi do\'kon?', x: -240, y: -600, w: 360, rot: -.06, tail: [60, 70]},
 {text: 'Qaysi kuryer?', x: 250, y: -430, w: 350, rot: .05, tail: [-70, 70]},
 {text: 'Boj qancha?', x: -270, y: 130, w: 320, rot: .04, tail: [80, -60]},
 {text: 'Jami necha pul?', x: 230, y: 330, w: 380, rot: -.05, tail: [-70, -60]},
 {text: 'Qachon keladi?', x: -40, y: 600, w: 380, rot: .03, tail: [0, -70]},
];
function bubbleRaw(b) {
 const d = drawing(), h = 108, pts = rrect(0, 0, b.w, h, 40), [tx, ty] = b.tail;
 // Insert the tail on the edge nearest the phone.
 const i = pts.reduce((bi, p, k) => Math.hypot(p[0] - tx, p[1] - ty) < Math.hypot(pts[bi][0] - tx, pts[bi][1] - ty) ? k : bi, 0);
 const a = pts[(i + pts.length - 1) % pts.length], c2 = pts[(i + 1) % pts.length];
 const out = [...pts.slice(0, i), lp2(a, pts[i], .5), [tx*1.25, ty*1.3], lp2(pts[i], c2, .5), ...pts.slice(i + 1)];
 d.add('outline', gesture(out), 1.4, 1, {corner: .9});
 return {strokes: d.strokes};
}
function bubbles(c, t) {
 const g = Math.floor(t*12);
 BUBBLES.forEach((b, k) => {
  const t0 = T.bubbles[k]; if (t < t0) return;
  let s = outBack(span(t, t0, t0 + .25));
  if (t >= T.land) s *= 1 - span(t, T.land + .04 + k*.05, T.land + .2 + k*.05, x => x*x);
  if (s <= .01) return;
  const jit = t >= T.tremble0 && t < T.land ? [((g + k) % 2 ? 3 : -3), ((g + k*3) % 2 ? 2 : -2)] : [0, 0];
  c.save(); c.translate(b.x + jit[0], b.y + jit[1]); c.rotate(b.rot); c.scale(s, s);
  fill(c, rrect(0, 0, b.w, 108, 40), PAPER, .92);
  pencil(c, cel('bubble' + k, bubbleRaw(b)));
  text(c, b.text, 0, 14, {size: 42, weight: 700, color: GRAPH});
  c.restore();
 });
}
// The tangle: one long searching line. It straightens into the route.
const TANGLE_N = 120;
const TANGLE = Array.from({length: TANGLE_N}, (_, k) => {
 const a = k*.55 + noise1(k*.21, 3)*2.4, r = 90 + 330*(.5 + .5*noise1(k*.13, 7)) + 60*Math.sin(k*.9);
 return [PH[0] + Math.cos(a)*r*1.05, PH[1] + Math.sin(a)*r*1.35];
});
const STRAIGHT = Array.from({length: TANGLE_N}, (_, k) => [0, lerp(-760, 640, k/(TANGLE_N - 1))]);
function tangleRaw(u) { const d = drawing(); d.add('line', TANGLE.map((p, k) => lp2(p, STRAIGHT[k], u)), 1.5, .9); return {strokes: d.strokes}; }

// ------------------------------------------------------------------ the hook: one world, two materials
const HEX = (cx, cy, R) => { const p = []; for (let i = 0; i < 6; i++) { const a = -Math.PI/2 + i*Math.PI/3; p.push([cx + R*Math.cos(a), cy + R*Math.sin(a)]); } return p; };
const revealR = t => t < T.land ? 0 : 2600*span(t, T.land, T.land + 1.1, easeOut);
function hookCamera(t) {
 if (t < T.B) return [0, -10, lerp(1.2, 1.25, easeInOutSine(t/T.B))];
 return [0, lerp(-10, -40, span(t, T.B, T.B + .8, easeInOutSine)), lerp(1.25, 1.0, span(t, T.B, T.B + .8, easeInOutSine))];
}
function hookWorld(c, t, mode) {
 if (mode === 'ink') {
  c.save(); c.fillStyle = 'rgba(10,12,153,.10)';
  for (let y = -1200; y < 1200; y += 60) for (let x = -540; x <= 540; x += 60) { c.beginPath(); c.arc(x + 30, y + 30, 2.2, 0, 2*Math.PI); c.fill(); }
  c.restore();
 }
 const land = t >= T.land, straightU = span(t, T.land + .05, T.straight1, inOutQuart);
 const tangleU = span(t, T.tangle0, T.tangle1, x => x*x*.6 + x*.4);
 const tangle = () => {
  if (t < T.tangle0) return;
  const id = 'tangle/' + Math.round(straightU*48);
  const compiled = CELS[id] ??= compileCel(tangleRaw(Math.round(straightU*48)/48), {id: 'tangle'});
  if (straightU <= 0) pencilPart(c, compiled, tangleU);
  else if (mode === 'ink') ink(c, compiled, BLUE); else pencil(c, compiled);
 };
 if (land) tangle();
 phone(c, mode, t);
 if (!land) tangle();
 if (t < T.land + .5) bubbles(c, t);
 if (t >= T.drop && t < T.toLogo1) {
  const u = span(t, T.drop, T.land, x => x*x*x), sq = t >= T.land ? Math.sin(Math.PI*span(t, T.land, T.land + .34))*.15 : 0;
  const pS = u < 1 ? lerp(.7, .86, u) : lerp(.86, 1, outBack(span(t, T.land, T.land + .5)));
  const k = span(t, T.toLogo0, T.toLogo1, easeInOutSine), px = lerp(PH[0], -146, k), py = lerp(PH[1] - 520*(1 - u), -407, k), sc = lerp(1, .11, k);
  const hx = lerp(PH[0] - 20, -146, k), hy = lerp(PH[1] - 10, -407, k), hS = t < T.land - .06 ? 0 : outBack(span(t, T.land - .04, T.land + .5))*lerp(1, .117, k);
  if (hS > 0) { c.save(); c.translate(hx, hy); c.scale(hS, hS); c.globalAlpha = span(t, T.land - .06, T.land + .1); c.drawImage(IMG.hex, -260, -284, 520, 568); c.restore(); }
  c.save(); c.translate(px + 20*(1 - k)*(t >= T.land ? 1 : 0), py); c.rotate(-14*DEG*(1 - u)); c.scale(pS*(1 + sq)*sc, pS*(1 - sq)*sc);
  c.drawImage(IMG.p, -100, -164, 200, 328); c.restore();
 }

  const a = (-160 + k*20)*DEG, r = 150 + (k % 3)*40, s = outBack(span(t, t0 + k*.04, t0 + k*.04 + .25))*(k % 2 ? 1 : .7)*((g + k) % 3 ? 1 : .8);

}

// ------------------------------------------------------------------ payoff: the parcel at the door
function payoff(c, t) {
 paper(c, BG, null, 23);
 const z = lerp(1.2, 1.3, span(t, T.arrive, T.cap3 + 1.5, easeInOutSine));

  const u = span(t, T.jump0, T.jump1), up = outBack(u), bob = t > T.jump1 ? Math.sin((Math.floor(t*12)/12 - T.jump1)*3.2)*7 : 0, sy = DOOR_Y - 130 - 200*up + bob;

 if (d2 > .5) { c.save(); c.strokeStyle = LIME; c.lineWidth = 12; c.lineCap = 'round'; c.beginPath(); c.moveTo(CX - 300, 1712); c.lineTo(CX - 300 + 600*span(t, T.cap3 + .6, T.cap3 + 1.1, easeOut), 1712); c.stroke(); c.restore(); }

  const u = span(t, T.iris0, T.iris1, x => x*x*x), sx = (-38)*z + CX, sy2 = (DOOR_Y - 60 - 4420)*z + CY;
  resetT(c); c.fillStyle = '#ffffff'; c.fill(pathOf(HEX(sx, sy2, 20 + 2400*u)));

}

// ------------------------------------------------------------------ the brand intro, ported from the app (1080x1920 stage)
const MS = .68, MW = 765*MS, MH = 835*MS, MARK = {x: (1080 - MW)/2, y: 560, w: MW, h: MH};
const PSZ = {w: 295*MS, h: 482*MS}, PC = {x: MARK.x + (410 + 147.5)*MS, y: MARK.y + (274 + 241)*MS}, WS = .40;
const GLYPHS = [{k: 'P', x: 897, w: 206}, {k: 'o', x: 1123, w: 214}, {k: 'c', x: 1361, w: 198}, {k: 'h', x: 1585, w: 194}, {k: 't', x: 1804, w: 134}, {k: 'a', x: 1966, w: 218}, {k: 'm', x: 2228, w: 303}, {k: 'dot', x: 2567, w: 52}];

const TAG = {x: WORD_X, y: WORD_Y + WORD_H + 34, w: WORD_W, h: 96*WS}, HEX_C = {x: MARK.x + 382.5*MS, y: MARK.y + 417.5*MS};
const LAND_CUE = 0, WORD_CUE = 1.05;
const an = (from, to, s, e, ease = easeOut) => T0 => from + (to - from)*ease(clamp((T0 - s)/(e - s), 0, 1));

function hexRounded() {

  const q = pts[i], pr = pts[(i + 5) % 6], nx = pts[(i + 1) % 6], l1 = Math.hypot(pr[0] - q[0], pr[1] - q[1]), l2 = Math.hypot(nx[0] - q[0], nx[1] - q[1]);
  const a = [q[0] + (pr[0] - q[0])/l1*k, q[1] + (pr[1] - q[1])/l1*k], b = [q[0] + (nx[0] - q[0])/l2*k, q[1] + (nx[1] - q[1])/l2*k];
  i ? p.lineTo(...a) : p.moveTo(...a); p.quadraticCurveTo(q[0], q[1], ...b);

}
const HEX_PATH = hexRounded(), HEX_LEN = 6*(431.3*MS - 2*150*.577*MS) + 6*150*.577*MS*1.6;
function endCard(c, t) {
 const T0 = t - T.iris1;
 resetT(c); c.fillStyle = '#ffffff'; c.fillRect(0, 0, W, H);
 const back = IA.back(T0), zoom = lerp(1.12, 1, back), fy = lerp(PC.y - 60, 960, back);
 c.save(); c.translate(540, 960); c.scale(zoom, zoom); c.translate(-540, -fy);
 const gridOp = lerp(1, .35, clamp((T0 - ILAND)/(WORD_CUE + .6 - ILAND), 0, 1));
 c.save(); c.fillStyle = `rgba(10,12,153,${.11*gridOp})`; for (let y = -1200; y < 3120; y += 60) for (let x = -600; x < 1680; x += 60) { c.beginPath(); c.arc(x + 30, y + 30, 2.25, 0, 2*Math.PI); c.fill(); } c.restore();
 const gs = IA.glowS(T0), go = IA.glowA(T0)*IA.glowB(T0);
 if (go > 0) { const g = c.createRadialGradient(HEX_C.x, HEX_C.y, 0, HEX_C.x, HEX_C.y, 700*gs); g.addColorStop(0, `rgba(10,12,153,${.12*go})`); g.addColorStop(.28, `rgba(10,12,153,${.06*go})`); g.addColorStop(.6, `rgba(10,12,153,${.015*go})`); g.addColorStop(.85, 'rgba(10,12,153,0)'); c.fillStyle = g; c.fillRect(HEX_C.x - 700, HEX_C.y - 700, 1400, 1400); }
 const ro = IA.ringOp(T0);
 if (ro > 0) { c.save(); c.translate(HEX_C.x, HEX_C.y); c.scale(IA.ringS(T0), IA.ringS(T0)); c.translate(-HEX_C.x, -HEX_C.y); c.globalAlpha = ro; c.strokeStyle = LIME; c.lineWidth = 12; c.lineCap = 'round'; c.lineJoin = 'round'; c.setLineDash([HEX_LEN*IA.outline(T0), HEX_LEN*2]); c.stroke(HEX_PATH); c.restore(); }
 const hs = IA.hexS(T0);
 c.save(); c.globalAlpha = IA.hexOp(T0); c.translate(MARK.x + MARK.w/2, MARK.y + MARK.h/2); c.scale(hs, hs); c.drawImage(IMG.hex, -MARK.w/2, -MARK.h/2, MARK.w, MARK.h); c.restore();
 GLYPHS.forEach((g, i) => {
  const st = WORD_CUE + i*.05, dy = an(60, 0, st, st + (g.k === 'dot' ? .8 : .5), g.k === 'dot' ? outElastic : outBack)(T0), op = an(0, 1, st, st + .15)(T0);
  if (op <= 0) return;
  c.save(); c.globalAlpha = op; c.drawImage(IMG[g.k], WORD_X + (g.x - 897)*WS, WORD_Y + dy, g.w*WS, WORD_H); c.restore();
 });
 const gl = IA.gOpA(T0)*IA.gOpB(T0);
 if (gl > 0) { c.save(); c.beginPath(); c.rect(WORD_X, WORD_Y - 12, WORD_W, WORD_H + 24); c.clip(); c.globalCompositeOperation = 'screen'; c.globalAlpha = gl; c.translate(WORD_X + IA.gX(T0), WORD_Y - 40); c.transform(1, 0, Math.tan(-14*DEG), 1, 0, 0); const gg = c.createLinearGradient(0, 0, 140, 0); gg.addColorStop(0, 'rgba(255,255,255,0)'); gg.addColorStop(.5, 'rgba(255,255,255,.85)'); gg.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = gg; c.fillRect(0, 0, 140, WORD_H + 100); c.restore(); }
 const cut = IA.tagCut(T0), to = IA.tagOp(T0);
 if (to > 0) { c.save(); c.globalAlpha = to; c.beginPath(); c.rect(TAG.x, TAG.y - TAG.h*.14, TAG.w*(1 - cut/100), TAG.h*1.28); c.clip(); c.drawImage(IMG.tagline, TAG.x, TAG.y, TAG.w, TAG.h); c.restore();
  const co = to*IA.curA(T0)*IA.curB(T0); if (co > 0) { c.save(); c.globalAlpha = co; c.fillStyle = LIME; c.beginPath(); c.roundRect(TAG.x + TAG.w*(1 - cut/100) - 3, TAG.y - 8, 6, TAG.h + 16, 3); c.fill(); c.restore(); } }
 const u = IA.u(T0), pS = u < 1 ? lerp(.7, .86, u) : IA.landS(T0), sq = Math.sin(Math.PI*clamp((T0 - ILAND)/.34, 0, 1))*.15;
 c.save(); c.globalAlpha = IA.pOp(T0); c.translate(PC.x, PC.y - 520*(1 - u)); c.rotate(-14*DEG*(1 - u)); c.scale(pS*(1 + sq), pS*(1 - sq)); c.drawImage(IMG.p, -PSZ.w/2, -PSZ.h/2, PSZ.w, PSZ.h); c.restore();
 c.restore();
 // The address, after the app's own intro has finished.
 const a = span(t, T.url, T.url + .4, easeOut);
 text(c, 'pochtam.uz', CX, 1640 + 24*(1 - a), {size: 92, color: BLUE, alpha: a});
 if (a > .6) { c.save(); c.strokeStyle = LIME; c.lineWidth = 14; c.lineCap = 'round'; const L = 470*span(t, T.url + .25, T.url + .7, easeOut); c.beginPath(); c.moveTo(CX - 235, 1676); c.lineTo(CX - 235 + L, 1676); c.stroke(); c.restore(); }
 text(c, 'Orzu qiling — qolganini biz hal qilamiz', CX, 1790, {size: 36, weight: 600, color: '#4E4F6B', alpha: span(t, T.url + .6, T.url + 1.0, easeOut)});
}

// ------------------------------------------------------------------ the frame
function shot(c, tau) {
 const f = Math.round(tau*FPS), t = f/FPS;
 if (t >= T.iris1) return endCard(c, t);
 if (t >= T.arrive) return payoff(c, t);
 if (t >= T.extra) return extraScene(c, t);
 if (t >= T.steps0) {
  stepsScene(c, t);
  // The drawn app screen gives way to the real one.
  if (t < T.steps0 + .35) { const u = span(t, T.steps0, T.steps0 + .35); c.save(); c.globalAlpha = 1 - u; hook(c, t); c.restore(); }
  return;
 }
 hook(c, t);
 // The five steps appear as dots, then become the progress line.
 const a = span(t, T.cap2 + .3, T.cap2 + .6);
 if (a > 0) { resetT(c); progress(c, t, -1, lerp(360, 104, span(t, T.steps0 - .5, T.steps0, easeInOutSine)), a); }
}

// ------------------------------------------------------------------ score
function score(ac, t0, dest) {
 const m = ac.createGain(); m.gain.value = .9; m.connect(dest);
 const B = 262, n = (o, s, t, d = .5, g = .07, type = 'sine') => note(ac, m, pentHz(o, s, B), t0, t, d, type, g);
 [[1, 0], [1, 2], [1, 4], [2, 0]].forEach(([o, s], k) => n(o, s, .25 + k*.45, 1.2, .05));
 n(2, 2, T.heart, .25, .06);
 T.bubbles.forEach((b, k) => { n(0, [1, 3, 2, 4, 3][k], b, .3, .08, 'triangle'); n(0, [1, 3, 2, 4, 3][k] + 1, b + .06, .25, .05, 'triangle'); });
 for (let t = 4.6, d = .4; t < T.drop - .05; t += d, d = Math.max(.12, d*.85)) noiseBurst(ac, m, t0, t, .03, .06, 3 + Math.round(t*10));
 note(ac, m, pentHz(-1, 0, B), t0, 3.0, 3.1, 'triangle', .04);
 noiseBurst(ac, m, t0, T.drop, .3, .05, 41);
 note(ac, m, pentHz(-1, 0, B), t0, T.land, .5, 'triangle', .25); noiseBurst(ac, m, t0, T.land, .08, .2, 42);
 [[0, 0], [0, 2], [0, 4], [1, 0], [1, 2]].forEach(([o, s], k) => n(o, s, T.land + .05 + k*.03, 2.2, .045, k % 2 ? 'triangle' : 'sine'));
 [0, 1, 2, 3, 4].forEach(i => n(1, [0, 1, 2, 3, 4][i], T.cap2 + .3 + i*.06, .4, .04));
 for (let t = T.steps0, k = 0; t < T.arrive; t += .5, k++) note(ac, m, pentHz(-1, [0, 0, 3, 2][k % 4], B), t0, t, .3, 'triangle', .08);
 [0, 1, 2, 3, 4].forEach(k => { const s = stepAt(k); [[1, k % 5], [1, (k + 2) % 5], [2, k % 5]].forEach(([o, q], i) => n(o, q, s + i*.02, 1, .045)); });
 const clickAt = [[1, 1.6], [3, .4], [4, .75], [4, 2.3]];
 clickAt.forEach(([k, s], i) => { noiseBurst(ac, m, t0, stepAt(k) + s, .03, .12, 50 + i); n(2, 4, stepAt(k) + s, .12, .03); });
 noiseBurst(ac, m, t0, stepAt(1) + .55, .12, .15, 60); n(3, 0, stepAt(1) + .55, .1, .03);          // shutter
 noiseBurst(ac, m, t0, stepAt(4) + .85, .25, .05, 61); n(2, 2, stepAt(4) + .9, .3, .04);           // message sent
 note(ac, m, pentHz(-1, 0, B), t0, T.arrive + .4, .4, 'triangle', .22); noiseBurst(ac, m, t0, T.arrive + .4, .1, .15, 70);
 noiseBurst(ac, m, t0, T.open0, .25, .04, 71);
 [[1, 0], [1, 2], [1, 4], [2, 0], [2, 2]].forEach(([o, s], k) => n(o, s, T.jump0 + k*.07, .9, .06));
 noiseBurst(ac, m, t0, T.iris0 + .1, .35, .04, 72);
 const I = T.iris1;
 note(ac, m, pentHz(-1, 0, B), t0, I + ILAND, .5, 'triangle', .22); noiseBurst(ac, m, t0, I + ILAND, .06, .15, 73);
 [[0, 0], [0, 4], [1, 2]].forEach(([o, s], k) => n(o, s, I + ILAND + .04 + k*.03, 2, .05));

 for (let k = 0; k < 6; k++) noiseBurst(ac, m, t0, I + WORD_CUE + .6 + k*.1, .015, .04, 80 + k);
 [[0, 0], [0, 2], [0, 4], [1, 0], [1, 4], [2, 0]].forEach(([o, s], k) => n(o, s, T.url + k*.04, 2.8, .045, k % 2 ? 'triangle' : 'sine'));
}

defineFilm({palette: {...PALETTES.pencilMinimal, paper: PAPER}, format: {ar: '9:16', width: 1080}, fps: 24,

}
