<script>
'use strict';
/* Film brief
Occasion: Ustoz va murabbiylar kuni. A third greeting to the teacher Dilshod
  Bahodirovich Mannopov, this time an old Eastern story about a teacher.
Story "Ustozning kavushi" (al-Khatib al-Baghdadi, Tarikh Baghdad, in the life
  of the grammarian al-Farra): the caliph al-Ma'mun gave his two sons to
  al-Farra to be taught. One day, when the lesson ended and the teacher rose,
  both princes ran to bring him his shoes; they quarrelled over who would, and
  settled it by each bringing one. The news reached the caliph, who called
  the teacher and asked: "Who is the most honoured of people?" - "I know none
  more honoured than the Commander of the Faithful." - "No: it is the one whose
  shoes, when he rises, the caliph's two heirs fight to bring." The teacher
  said he had wanted to stop them but feared to keep them from an honour they
  raced for. The caliph: "Had you stopped them, I would have reproached you.
  It did not lower them; it raised them. However great a man is, he is not
  too great to serve his ruler, his father and his teacher." The film closes
  on Alisher Navoi's couplet "Haq yo'lida kim senga bir harf o'qitmish ranj
  ila, / Aylamak bo'lmas ado oning haqin yuz ganj ila" and the greeting.
Look: Eastern shadow theatre. A carved dark wooden proscenium frames a lit
  cloth screen; the captions sit in the dark band above it. On the screen,
  jointed puppets cut from dark leather, in profile, with cut-out eyes and
  pierced ornament that lets the light through, held on thin rods. Sets are
  cut silhouettes too; windows and lamps carry coloured glass. The light
  behind the screen is warm lamplight indoors and a blue gel for the night
  city. A close-up is the puppets brought nearer the screen (the camera
  scales the stage inside the frame; the light stays with the screen).
Acting reference: shadow puppetry. The figures move as jointed puppets do, on
  purpose: limbs pivot, bodies turn by flipping, a walk is a swung stride with
  a bob. Poses are designed per beat (kneel, rise, run, reach, tug, carry,
  offer, bow, gesture); hands that hold a shoe are solved to the shoe.
Format: 9:16, 1080x1920, 24 fps. Closing card holds 10 s.
Sound: synthesized here, pitched sounds only: a plucked oud-like string
  (Karplus-Strong from a smoothed pluck, so no noise burst), a drone, a
  ney-like flute and pitched frame-drum thumps, in a Hijaz-coloured mode on D.
Engine: hand-drawn-canvas-animation skill (MIT, Alexey Fateev).
*/
{
// ------------------------------------------------------------------ look
const INK = '#1a0f0a', WOOD = '#150b07', WOOD2 = '#2a160c', GOLD = '#e8b25c', GOLD2 = '#c98a3a', CREAM = '#f7e9cc';
const uz = s => String(s).replace(/([oOgG])'/g, '$1ʻ').replace(/'/g, 'ʼ');
for (const f of FILM_FONTS) { const ff = new FontFace(f.family, `url(${f.src})`, {weight: f.weight, style: f.style, unicodeRange: f.range}); document.fonts.add(ff); _photoLoads.push(ff.load()); }
_photoLoads.push(document.fonts.load('italic 400 40px Literata', uz("o'g'")), document.fonts.load('600 40px Fraunces', uz("O'zbek")));

const FPS = 24, DEG = Math.PI/180;
const span = (t, a, b, e = x => x) => e(clamp((t - a)/(b - a), 0, 1));
const win = (t, a, b, fi = .6, fo = .6) => Math.min(span(t, a, a + fi, easeOut), 1 - span(t, b - fo, b, easeIn));
const lp2 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
const add = (a, b) => [a[0] + b[0], a[1] + b[1]], mul = (a, k) => [a[0]*k, a[1]*k];
const dirv = a => [Math.sin(a), Math.cos(a)];                    // limb direction: angle from straight down, positive = forward
const rot = (p, th) => [p[0]*Math.cos(th) - p[1]*Math.sin(th), p[0]*Math.sin(th) + p[1]*Math.cos(th)];
const ss = (a, b, x) => { const u = clamp((x - a)/(b - a), 0, 1); return u*u*(3 - 2*u); };
// a smooth closed (or open) outline through points: Catmull-Rom as cubic Béziers
function sp(pts, closed = true) {
  const p = new Path2D(), n = pts.length, P = i => closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)];
  p.moveTo(...P(0));
  for (let i = 0; i < (closed ? n : n - 1); i++) { const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    p.bezierCurveTo(p1[0] + (p2[0] - p0[0])/6, p1[1] + (p2[1] - p0[1])/6, p2[0] - (p3[0] - p1[0])/6, p2[1] - (p3[1] - p1[1])/6, p2[0], p2[1]); }
  if (closed) p.closePath(); return p;
}
const poly = (pts, closed = true) => { const p = new Path2D(); pts.forEach((q, i) => i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1])); if (closed) p.closePath(); return p; };
function hull(points) {
  const P = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]), cross = (o, a, b) => (a[0] - o[0])*(b[1] - o[1]) - (a[1] - o[1])*(b[0] - o[0]);
  const lo = [], up = [];
  for (const p of P) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (const p of P.reverse()) { while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }

}
// a rounded hull around discs [x, y, r]: cloth over the joints it covers
const drape = discs => sp(hull(discs.flatMap(([x, y, r]) => Array.from({length: 10}, (_, k) => [x + r*Math.cos(k*TAU/10), y + r*Math.sin(k*TAU/10)]))));
function limbPath(a, b, w0, w1) {

  p.moveTo(a[0] + nx*w0/2, a[1] + ny*w0/2); p.lineTo(b[0] + nx*w1/2, b[1] + ny*w1/2); p.arc(b[0], b[1], w1/2, g + Math.PI/2, g - Math.PI/2, true);
  p.lineTo(a[0] - nx*w0/2, a[1] - ny*w0/2); p.arc(a[0], a[1], w0/2, g - Math.PI/2, g + Math.PI/2, true); p.closePath(); return p;
}
function text(c, str, x, y, {size = 50, font = 'italic 400', fam = 'Literata', color = CREAM, align = 'center', alpha = 1, glow = 0, spacing = null} = {}) {
  if (alpha <= 0) return;
  c.save(); c.font = `${font} ${size}px ${fam}`; c.textAlign = align; c.textBaseline = 'alphabetic'; c.globalAlpha *= alpha;
  c.letterSpacing = spacing ?? (fam === 'Fraunces' ? (-.01*size).toFixed(1) + 'px' : '0px');
  if (glow) { c.shadowColor = 'rgba(255,190,110,.45)'; c.shadowBlur = glow; }
  c.fillStyle = color; c.fillText(uz(str), x, y); c.restore();
}
function wrap(c, str, size, maxW, font = 'italic 400', fam = 'Literata') {
  c.save(); c.font = `${font} ${size}px ${fam}`; const out = []; let cur = '';
  for (const w of uz(str).split(' ')) { const t = cur ? cur + ' ' + w : w; if (cur && c.measureText(t).width > maxW) { out.push(cur); cur = w; } else cur = t; }
  if (cur) out.push(cur); c.restore(); return out;
}

// ------------------------------------------------------------------ the theatre: proscenium and screen
const SCR = {l: 40, r: 1040, top: 560, peak: 452, bot: 1596};
const screenPath = (() => { const {l, r, top, peak, bot} = SCR, m = (l + r)/2, p = new Path2D();
  p.moveTo(l, bot); p.lineTo(l, top); p.bezierCurveTo(l, top - 70, m - 250, peak + 6, m, peak); p.bezierCurveTo(m + 250, peak + 6, r, top - 70, r, top); p.lineTo(r, bot); p.closePath(); return p; })();
const LAYER = document.createElement('canvas'); LAYER.width = 1080; LAYER.height = 1920; const LG = LAYER.getContext('2d');
function proscenium(c, t) {
  c.save(); c.fillStyle = WOOD; c.fillRect(0, 0, W, H);
  // the carved frame: a gold inlay along the arch, a band of pierced rosettes, a skirting below
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1d0f09'); g.addColorStop(.25, '#120906'); g.addColorStop(.8, '#120906'); g.addColorStop(1, '#1d0f09'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.strokeStyle = 'rgba(232,178,92,.55)'; c.lineWidth = 3; c.save(); c.translate(0, -16); c.stroke(screenPath); c.restore();
  c.strokeStyle = 'rgba(232,178,92,.22)'; c.lineWidth = 1.5; c.save(); c.translate(540, 1000); c.scale(1.035, 1.03); c.translate(-540, -1000); c.stroke(screenPath); c.restore();
  for (let k = 0; k < 13; k++) { const x = 60 + k*80, y = 1700; rosette(c, x, y, 20, 'rgba(232,178,92,.18)'); }
  c.fillStyle = 'rgba(232,178,92,.16)'; c.fillRect(40, 1648, 1000, 2); c.fillRect(40, 1752, 1000, 2);
  c.restore();
}
function rosette(c, x, y, r, col) {
  c.save(); c.translate(x, y); c.fillStyle = col;
  for (let k = 0; k < 8; k++) { c.rotate(TAU/8); c.beginPath(); c.ellipse(r*.55, 0, r*.42, r*.16, 0, 0, TAU); c.fill(); }
  c.beginPath(); c.arc(0, 0, r*.2, 0, TAU); c.fill(); c.restore();
}
// the light behind the cloth: warm lamplight or a blue gel, with a slow flicker and the cloth's weave
function backlight(c, t, mood) {
  c.save(); c.clip(screenPath);
  const f = 1 + .025*noise1(t*1.7, 3) + .012*noise1(t*6.1, 4), [cx, cy] = [540 + 30*noise1(t*.4, 5), 1040];
  const g = c.createRadialGradient(cx, cy, 60, cx, cy, 900);
  const warm = [[0, `rgb(${255},${Math.round(226*f)},${Math.round(160*f)})`], [.45, `rgb(${Math.round(246*f)},${Math.round(178*f)},${Math.round(98*f)})`], [1, '#6e3514']];
  const night = [[0, '#6f8fc4'], [.5, '#34497e'], [1, '#101a3a']];
  const mix = (A, B, u) => A.map(([o, a], i) => [o, u <= 0 ? a : u >= 1 ? B[i][1] : a]);
  (mood === 'night' ? night : warm).forEach(([o, col]) => g.addColorStop(o, col));
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.restore();
}
function cloth(c) {                                   // the weave and the soft falloff at the edges of the screen
  c.save(); c.clip(screenPath); c.globalCompositeOperation = 'multiply';
  const v = c.createRadialGradient(540, 1040, 380, 540, 1040, 820); v.addColorStop(0, 'rgba(255,255,255,0)'); v.addColorStop(1, 'rgba(120,70,40,.55)'); c.fillStyle = v; c.fillRect(0, 0, W, H);
  c.globalAlpha = .06; c.fillStyle = '#6b4a30'; for (let y = SCR.peak; y < SCR.bot; y += 4) c.fillRect(SCR.l, y, SCR.r - SCR.l, 1);
  c.restore();
}

// ------------------------------------------------------------------ puppets
// Right-facing, pelvis at (0,0), y down. A pose gives the lean of the torso, the nod of the head, two legs
// (hip angle a from straight down, knee k, foot angle f) and two arms (shoulder a, elbow e, or a target `to`
// in stage coordinates that the arm is solved to). Index 0 is the near limb (towards us), 1 the far one.
const PRINCE = {s: 1, thigh: 86, shin: 84, upper: 60, fore: 56, hip: [0, 2], shoulder: [2, -100], neck: [2, -118], legW: [26, 20, 18, 13], armW: [19, 15, 14, 11], headSc: 1.14,
  torso: [[-20, 6], [-24, -36], [-24, -84], [-17, -108], [-6, -118], [8, -118], [20, -104], [25, -72], [22, -30], [19, 6]], skirt: 'kaftan', head: 'prince'};
const PRINCE2 = {...PRINCE, s: .88, head: 'prince2'};
const TEACHER = {s: 1.28, thigh: 92, shin: 90, upper: 60, fore: 56, hip: [0, 2], shoulder: [2, -108], neck: [2, -128], legW: [24, 19, 17, 12], armW: [24, 20, 17, 13], headSc: 1,
  torso: [[-24, 8], [-28, -40], [-29, -88], [-24, -112], [-12, -126], [4, -132], [14, -128], [25, -110], [29, -76], [27, -36], [24, 8]], skirt: 'robe', head: 'teacher', sleeve: 1};
const CALIPH = {...TEACHER, s: 1.3, head: 'caliph', torso: [[-26, 8], [-32, -40], [-33, -92], [-26, -118], [-12, -132], [4, -138], [16, -134], [28, -114], [32, -76], [30, -36], [26, 8]]};
const knock = (g, path, w = 2.6) => { g.save(); g.globalCompositeOperation = 'destination-out'; g.lineWidth = w; g.stroke(path); g.restore(); };
const hole = (g, path) => { g.save(); g.globalCompositeOperation = 'destination-out'; g.fill(path); g.restore(); };
function joints(sp_, P) {
  const R = p => rot(p, P.lean ?? 0), sh = R(sp_.shoulder), neck = R(sp_.neck), toLocal = q => [(q[0] - P.x)/((P.dir ?? 1)*sp_.s*(P.sc ?? 1)), (q[1] - P.y)/(sp_.s*(P.sc ?? 1))];
  const legs = (P.legs ?? [{a: .06, k: -.05}, {a: -.06, k: -.05}]).map(L => { const knee = add(sp_.hip, mul(dirv(L.a), sp_.thigh)), ankle = add(knee, mul(dirv(L.a + L.k), sp_.shin)); return {hip: sp_.hip, knee, ankle, f: L.f ?? 0, foot: L.foot}; });
  const arms = (P.arms ?? [{a: .1, e: .2}, {a: -.05, e: .25}]).map(A => {
    if (A.to) { const s = solveLimb(sh, toLocal(A.to), sp_.upper, sp_.fore, A.bend ?? 1); return {sh, el: s.joint, wr: s.end, hand: A.hand ?? 0}; }
    const el = add(sh, mul(dirv(A.a), sp_.upper)), wr = add(el, mul(dirv(A.a + A.e), sp_.fore)); return {sh, el, wr, hand: A.hand ?? 0}; });

}
// a hand (a small mitten with a thumb) or a foot at the end of a limb
function handPath(wr, from, open = 0) { const g = Math.atan2(wr[1] - from[1], wr[0] - from[0]), p = new Path2D();
  p.ellipse(wr[0] + Math.cos(g)*9, wr[1] + Math.sin(g)*9, 13, 8.5, g, 0, TAU); p.ellipse(wr[0] + Math.cos(g - 1.1)*9, wr[1] + Math.sin(g - 1.1)*9, 7, 4.5, g - .6 - open, 0, TAU); return p; }
// kavush: a slipper with a pointed, upturned toe (length ~ 64 at scale 1), heel at 0,0, sole on y = 0
const KAVUSH = [[-4, -2], [-3, -18], [8, -21], [24, -14], [44, -14], [58, -10], [68, -12], [76, -22], [80, -19], [74, -4], [62, 1], [6, 2]];
function footPath(an, f, kind, sc = 1) {
  const p = new Path2D(), m = new DOMMatrix().translate(an[0], an[1]).rotate(f/DEG).scale(sc);
  if (kind === 'kavush') p.addPath(sp(KAVUSH.map(([x, y]) => [x - 14, y + 12])), m);
  else if (kind === 'boot') p.addPath(sp([[-12, -6], [-12, 8], [14, 12], [40, 13], [52, 9], [56, 2], [40, -2], [10, -8]]), m);
  else p.addPath(sp([[-12, -4], [-11, 9], [10, 12], [34, 12], [44, 7], [36, 0], [12, -6]]), m);   // a stockinged foot
  return p;
}
function headPath(kind) {
  // origin at the neck joint; the profile faces right
  const face = [[-24, -18], [-26, -44], [-16, -64], [2, -70], [20, -63], [29, -48], [31, -40], [38, -30], [31, -26], [32, -20], [29, -15], [27, -6], [14, 0], [8, 8], [-10, 8]];
  const p = new Path2D(); p.addPath(sp(face));
  const T = {
    prince: [[-29, -40], [-33, -58], [-26, -76], [-8, -86], [14, -84], [30, -70], [34, -54], [30, -46], [12, -50], [-10, -50], [-24, -44]],
    prince2: [[-27, -44], [-28, -60], [-22, -80], [0, -84], [22, -80], [29, -60], [30, -48], [2, -52]],
    teacher: [[-32, -36], [-40, -58], [-38, -84], [-22, -102], [2, -110], [26, -104], [42, -86], [46, -62], [40, -46], [22, -50], [0, -52], [-22, -44]],
    caliph: [[-34, -36], [-44, -60], [-42, -90], [-24, -112], [4, -120], [30, -114], [48, -94], [52, -64], [44, -46], [22, -50], [0, -52], [-24, -44]],
  }[kind];

    p.addPath(sp([[30, -18], [34, -6], [34, 12], [26, 36], [16, 50], [10, 30], [2, 10], [-4, -2], [12, -6]]));            // a long scholar's beard
    p.addPath(sp([[-34, -44], [-46, -26], [-50, 4], [-44, 26], [-34, 8], [-26, -26]]));                                  // the turban's tail
  }
  if (kind === 'prince') p.addPath(sp([[10, -82], [12, -104], [22, -124], [32, -132], [28, -112], [20, -86]]));             // a plume

  const p = new Path2D(); p.ellipse(19, -41, 5.2, 2.6, -.08, 0, TAU);                                             // the cut-out eye
  const slit = (x0, y0, x1, y1, bow, w) => { const m = [(x0 + x1)/2 + bow, (y0 + y1)/2 - bow*.3]; p.addPath(sp([[x0, y0], [m[0], m[1] - w], [x1, y1], [m[0], m[1] + w]])); };
  if (kind === 'teacher' || kind === 'caliph') { slit(-30, -64, 20, -92, -6, 2.4); slit(-26, -50, 30, -76, -6, 2.2); slit(-20, -88, 12, -102, -4, 1.8); }   // the wraps of the turban
  if (kind === 'prince') { slit(-24, -56, 22, -64, -3, 2); p.moveTo(18, -66); p.arc(14, -66, 4, 0, TAU); }
  if (kind === 'prince2') for (let k = 0; k < 3; k++) { const x = -14 + k*14; p.addPath(sp([[x, -58], [x + 4, -66], [x + 2, -74], [x - 3, -66]])); }  // a skullcap with pepper motifs

// draws one puppet into the layer canvas (its own knock-outs and piercings never touch the set)
function puppet(g, sp_, P) {

    if (near) knock(g, p, 5); g.fill(p); };
  const arm = (A, near) => { const [w0, w1, w2, w3] = sp_.armW, p = new Path2D();
    p.addPath(limbPath(A.sh, A.el, w0, w1)); p.addPath(limbPath(A.el, A.wr, w2, w3)); p.addPath(handPath(A.wr, A.el, A.hand));
    if (sp_.sleeve) { const m = lp2(A.el, A.wr, .62); p.addPath(drape([[A.el[0], A.el[1], 13], [m[0], m[1] + 14, 16], [A.wr[0] - 2, A.wr[1] + 10, 15], [A.wr[0], A.wr[1] - 4, 11]])); }   // a wide sleeve that hangs

  // cloth over the legs: a knee-length kaftan or a robe to the ankles
  const Lg = J.legs, R = p => rot(p, lean);
  let skirt;
  if (sp_.skirt === 'robe') {                          // an A-line robe to the ankles, following the knees when he sits
    const fl = Lg.map(L => clamp(Math.cos(Math.atan2(L.knee[0] - L.hip[0], L.knee[1] - L.hip[1])), 0, 1)), low = sp_.hip[1] + sp_.thigh + sp_.shin - 14;
    const hem = Lg.map((L, i) => lp2([L.ankle[0], L.ankle[1] - 14], [L.ankle[0]*.6, low], .3*fl[i]));
    const hx = hem.map(h => h[0]), hy = Math.max(...hem.map(h => h[1])), f = Math.min(...fl);
    skirt = drape([[...R([-26, -40]), 16], [...R([22, -40]), 16], [...R([-28, -4]), 17], [...R([24, -4]), 17], ...Lg.map(L => [L.knee[0], L.knee[1], 20]), ...hem.map(h => [h[0], h[1], 20]),
      [Math.min(...hx) - 56*f, hy - 2, 18], [Math.max(...hx) + 36*f, hy, 17]]);
  } else {                                            // a kaftan: fitted at the waist, the skirt hangs to the knee
    const hang = L => lp2(L.knee, add(L.hip, [0, sp_.thigh*.95]), .45);
    skirt = drape([[...R([-22, -8]), 14], [...R([19, -8]), 14], ...Lg.map(L => { const q = hang(L); return [q[0], q[1], 17]; })]);
  }
  g.fill(skirt);
  const torso = sp(sp_.torso.map(R)); g.fill(torso);

  if (ta > 0) { text(c, 'Ustozning kavushi', 540, 282, {size: 84, font: '600', fam: 'Fraunces', color: GOLD, alpha: ta, glow: 16}); text(c, 'Sharq rivoyati', 540, 354, {size: 42, alpha: ta*.9}); }
  for (const [[a, b], str, who] of CAPS) { const al = win(t, a, b, .5, .5); if (al <= 0) continue;
    const lines = wrap(c, str, 50, 940), lh = 66, y0 = 300 - (lines.length - 1)*lh/2 + 10*(1 - span(t, a, a + .8, easeOut));
    if (who) text(c, who, 540, y0 - 74, {size: 28, font: '600', fam: 'Fraunces', color: GOLD, alpha: al, spacing: '6px'});
    lines.forEach((l, i) => text(c, l, 540, y0 + i*lh, {size: 50, alpha: al})); }
  cardBand(c, t);
}

// ------------------------------------------------------------------ the frame
const SCN = document.createElement('canvas'); SCN.width = 1080; SCN.height = 1920; const SG = SCN.getContext('2d');
// one scene on the screen: its light, its stage through its camera, its glows
function stage(c, t, which) {
  const mood = which === 'night' ? 'night' : 'warm'; backlight(c, t, mood);
  const V = view(t, CAMS[which]); LG.setTransform(1, 0, 0, 1, 0, 0); LG.clearRect(0, 0, 1080, 1920); LG.setTransform(V.s, 0, 0, V.s, V.x, V.y);
  if (which === 'night') nightSky(c, t, V);
  ({night: nightSet, lesson: lessonScene, hall: hallScene, page: pageScene})[which](LG, t);
  LG.setTransform(1, 0, 0, 1, 0, 0);
  c.save(); c.clip(screenPath); c.drawImage(LAYER, 0, 0);
  const lamps = {lesson: [[190, 770, 0], [900, 770, 3]], hall: [[560, 710, 0], [820, 750, 2]], page: [[540, 730, 0]], night: []}[which];
  for (const [x, y, o] of lamps) lampGlow(c, V.x + x*V.s, V.y + y*V.s, t + o, .9);
  if (which === 'night') { const g = span(t, 7.0, 8.55, easeIn); if (g > 0) { c.fillStyle = `rgba(255,214,140,${g})`; c.fillRect(0, 0, W, H); } }   // into the lit window
  c.restore();
}
function frame(c, tau) {
  const t = Math.round(tau*FPS)/FPS; resetT(c);
  proscenium(c, t);
  const which = t < 8.6 ? 'night' : t < T.hall ? 'lesson' : t < T.page ? 'hall' : 'page';
  stage(c, t, which);
  if (t >= 8.6 && t < 9.4) { c.save(); c.clip(screenPath); c.fillStyle = `rgba(255,214,140,${1 - span(t, 8.6, 9.4, easeInOutSine)})`; c.fillRect(0, 0, W, H); c.restore(); }
  // between scenes the lamp behind the cloth is lowered and raised again
  const dim = Math.max(...[T.hall, T.page].map(ts => 1 - Math.min(1, Math.abs(t - ts)/.7)));
  if (dim > 0) { c.save(); c.clip(screenPath); c.fillStyle = `rgba(12,6,4,${easeInOutSine(dim)*.97})`; c.fillRect(0, 0, W, H); c.restore(); }
  cloth(c);
  if (which === 'page') { c.save(); c.clip(screenPath); pageText(c, t); c.restore(); }
  captions(c, t);
  const f = 1 - span(t, T.fade[0], T.fade[1]); if (f > 0) { c.save(); c.globalAlpha = f; c.fillStyle = '#000'; c.fillRect(0, 0, W, H); c.restore(); }
}

// ------------------------------------------------------------------ score: D Hijaz (D Eb F# G A Bb C), synthesized, pitched sounds only
const mtof = m => 440*Math.pow(2, (m - 69)/12);
function score(ac, t0, dest) {
  const SR = ac.sampleRate, G = (v, d) => { const g = ac.createGain(); g.gain.value = v; if (d) g.connect(d); return g; };
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 2; comp.knee.value = 10; comp.attack.value = .01; comp.release.value = .3;
  const master = G(.9, dest); comp.connect(master);
  master.gain.setValueAtTime(.9, t0 + T.end - 1.2); master.gain.linearRampToValueAtTime(0, t0 + T.end - .05);
  const len = Math.ceil(SR*3), ir = ac.createBuffer(2, len, SR);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch), r = rng(ch + 31); for (let i = 0; i < len; i++) d[i] = (r()*2 - 1)*Math.pow(1 - i/len, 3.2); }
  const room = ac.createConvolver(); room.buffer = ir; const rlp = ac.createBiquadFilter(); rlp.type = 'lowpass'; rlp.frequency.value = 3000; room.connect(rlp); rlp.connect(G(1, comp));
  const bus = G(1, comp); bus.connect(G(.36, room));
  const env = (p, t, a, peak, d) => { p.setValueAtTime(0, t); p.linearRampToValueAtTime(peak, t + a); p.exponentialRampToValueAtTime(.0001, t + a + d); p.setValueAtTime(0, t + a + d + .01); };
  const osc = (f, t, a, peak, d, dst, type = 'sine') => { const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; env(g.gain, t, a, peak, d); o.connect(g); g.connect(dst); o.start(t); o.stop(t + a + d + .05); };
  // a plucked string (Karplus-Strong). The pluck is smoothed first, so the note starts as a soft tone, never a burst.
  const KS = {};
  const ksBuf = (m, bright, dur) => { const k = `${m}|${bright}`; if (KS[k]) return KS[k];
    const f = mtof(m), N = Math.max(2, Math.round(SR/f - .5)), n = Math.ceil(SR*dur), b = ac.createBuffer(1, n, SR), d = b.getChannelData(0), line = new Float32Array(N), r = rng(m*7 + Math.round(bright*10));
    for (let i = 0; i < N; i++) line[i] = r()*2 - 1;
    for (let p = 0; p < Math.round(lerp(7, 1, bright)); p++) { let prev = line[N - 1]; for (let i = 0; i < N; i++) { const v = line[i]; line[i] = .5*(v + prev); prev = v; } }
    let mean = 0; for (let i = 0; i < N; i++) mean += line[i]/N; for (let i = 0; i < N; i++) line[i] -= mean;
    const S = lerp(.9975, .9992, bright); let idx = 0, peak = 1e-6;
    for (let i = 0; i < n; i++) { const a = line[idx], c = line[(idx + 1) % N]; d[i] = a; line[idx] = S*.5*(a + c); idx = (idx + 1) % N; peak = Math.max(peak, Math.abs(a)); }
    for (let i = 0; i < n; i++) d[i] /= peak; const fo = Math.round(SR*.05); for (let i = 0; i < fo; i++) d[n - 1 - i] *= i/fo;
    return KS[k] = b; };
  const pluck = (m, t, v, bright = .35, dur = 2.6, dst = bus) => { if (t + t0 < -dur) return; const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = ksBuf(m, bright, dur); g.gain.value = v; s.connect(g); g.connect(dst); const at = t0 + t; if (at >= 0) s.start(at); else s.start(0, -at); };
  const oud = (m, t, v = .1) => pluck(m, t, v, .3, 2.8);
  const santur = (m, t, v = .05) => pluck(m, t, v, .8, 2.2);
  // a ney: a breathy-free flute of sines, a small scoop into the note and a vibrato that grows
  const neyBus = G(1); const nlp = ac.createBiquadFilter(); nlp.type = 'lowpass'; nlp.frequency.value = 2600; neyBus.connect(nlp); nlp.connect(bus);
  const ney = (m, t, d, v = .05) => { t += t0; const f = mtof(m), o = ac.createOscillator(), o2 = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain(), g = ac.createGain(), g2 = ac.createGain();
    o.frequency.setValueAtTime(f*.985, t); o.frequency.linearRampToValueAtTime(f, t + .09); o2.frequency.setValueAtTime(f*2*.985, t); o2.frequency.linearRampToValueAtTime(f*2, t + .09);
    lfo.frequency.value = 5.1; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f*.007, t + Math.min(.7, d*.6)); lfo.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .14); g.gain.setValueAtTime(v, t + Math.max(.15, d - .05)); g.gain.linearRampToValueAtTime(0, t + d + .3);
    g2.gain.value = .16; o.connect(g); o2.connect(g2); g2.connect(g); g.connect(neyBus); for (const x of [o, o2, lfo]) { x.start(t); x.stop(t + d + .4); } };
  const bell = (m, t, v, d = 2) => { t += t0; const f = mtof(m), c = ac.createOscillator(), mo = ac.createOscillator(), mg = ac.createGain(), g = ac.createGain();
    c.frequency.value = f; mo.frequency.value = f*2; mg.gain.setValueAtTime(f*.8, t); mg.gain.exponentialRampToValueAtTime(f*.02, t + d*.7); mo.connect(mg); mg.connect(c.frequency);
    env(g.gain, t, .004, v, d); c.connect(g); g.connect(bus); c.start(t); mo.start(t); c.stop(t + d + .1); mo.stop(t + d + .1); };
  // a frame drum, pitched: a low "dum" that falls, a short "tek"
  const dum = (t, v = .16) => { t += t0; const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(96, t); o.frequency.exponentialRampToValueAtTime(56, t + .16); env(g.gain, t, .004, v, .42); o.connect(g); g.connect(bus); o.start(t); o.stop(t + .5); };
  const tek = (t, v = .05) => { t += t0; osc(560, t, .002, v, .07, bus, 'triangle'); osc(560*1.58, t, .002, v*.4, .05, bus, 'sine'); };
  // a drone under each scene
  const droneBus = G(1); const dlp = ac.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 420; droneBus.connect(dlp); dlp.connect(bus);
  const drone = (ms, a, b, v) => ms.forEach(m => [-5, 5].forEach(det => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det;
    g.gain.setValueAtTime(0, t0 + a); g.gain.linearRampToValueAtTime(v, t0 + a + 2); g.gain.setValueAtTime(v, t0 + b - 1.5); g.gain.linearRampToValueAtTime(0, t0 + b); o.connect(g); g.connect(droneBus); o.start(t0 + a); o.stop(t0 + b + .1); }));
  const seq = (arr, fn) => arr.forEach(e => fn(...e));

  // --- the night: a slow ney over the drone, stars, a rising run into the lit window
  drone([38, 45], .3, 39.4, .006);
  seq([[1.2, 69, 1.4], [2.6, 70, .5], [3.1, 69, .6], [3.7, 67, .6], [4.3, 66, .9], [5.2, 63, .5], [5.7, 62, 2.0]], (t, m, d) => ney(m, t, d, .045));
  seq([[1.0, 50], [3.0, 57], [5.0, 50], [6.6, 50], [6.7, 57], [6.8, 62]], (t, m) => oud(m, t, .09));
  seq([[1.8, 86], [2.9, 81], [4.4, 78], [6.2, 86]], (t, m) => santur(m, t, .03));
  [62, 66, 69, 74, 78, 81].forEach((m, i) => santur(m, 7.9 + i*.11, .04)); bell(81, 8.6, .04, 2.4);
  // --- the lesson: an oud ostinato, a ney phrase for each line
  const OST = [50, 57, 62, 63, 62, 57, 54, 55];
  for (let b = 0; b < 5; b++) OST.forEach((m, i) => { const t = 9.0 + b*3 + i*.375; if (t < 19.8) oud(m, t, i === 0 ? .1 : .06); });
  seq([[10.5, 74, .75], [11.25, 72, .375], [11.625, 70, .375], [12.0, 69, 1.5], [14.3, 70, .375], [14.675, 72, .375], [15.05, 70, .75], [15.8, 69, .75], [16.55, 67, .75], [17.3, 66, .75], [18.05, 67, .375], [18.425, 69, 1.4]], (t, m, d) => ney(m, t, d, .04));
  oud(45, 19.4, .1); oud(50, 21.7, .09); santur(74, 21.9, .03);
  // --- the race: a drum pulse, a run up the scale, the grab; the tug as a call and an answer
  dum(22.6, .12); for (let t = 22.8; t < 24.9; t += .2) (Math.round((t - 22.8)/.2) % 4 ? tek : dum)(t, .05);
  [62, 63, 66, 67, 69, 70, 72, 74, 75, 78, 79, 81].forEach((m, i) => oud(m, 23.05 + i*.1, .06));
  dum(24.9, .12); [50, 57, 62].forEach((m, i) => oud(m, 24.9 + i*.02, .1));
  for (let k = 0; k < 6; k++) { const t = 25.6 + k*.575*2; if (t > 29.2) break; [62, 66, 69].forEach((m, i) => oud(m, t + i*.09, .07)); [69, 67, 66].forEach((m, i) => oud(m, t + .575 + i*.09, .065)); tek(t, .04); tek(t + .575, .04); }
  // --- they agree: a warm turn, a tender ney, a chime for each shoe set down
  [50, 57, 62, 66, 69].forEach((m, i) => oud(m, 29.7 + i*.08, .08));
  seq([[30.1, 69, 1.0], [31.1, 70, .5], [31.6, 69, .5], [32.1, 66, 1.0], [33.1, 67, .5], [33.6, 69, 1.4], [35.4, 74, 1.0], [36.4, 72, .5], [36.9, 70, .5], [37.4, 69, 1.6]], (t, m, d) => ney(m, t, d, .042));
  for (let t = 30.2; t < 38.2; t += 1.0) oud([50, 57, 62, 57][Math.round((t - 30.2)) % 4], t, .05);

  bell(50, T.hall, .05, 2.6);
  // --- the throne hall: a fuller drone, a slow drum, the oud low; the ney only between the lines
  drone([38, 45, 50], T.hall + .4, T.page + .2, .005);
  for (let t = 40.4; t < 43.5; t += .75) dum(t, .09);
  for (let t = 44.0; t < 75.2; t += 3) { oud(50, t, .07); oud(57, t + 1.5, .05); }
  for (let t = 45.5; t < 75.2; t += 6) dum(t, .06);
  seq([[48.4, 69, .4], [52.6, 66, .5], [59.4, 67, .5], [64.2, 69, .5]], (t, m, d) => ney(m, t, d, .035));
  bell(62, 52.9, .05, 3); [62, 66, 69, 74, 78].forEach((m, i) => santur(m, 55.4 + i*.09, .035));

  seq([[69.7, 69, 1.8], [71.6, 70, .8], [72.5, 69, .6], [73.1, 74, 1.4], [74.6, 62, 1.2]], (t, m, d) => ney(m, t, d, .045));
  bell(74, 73.1, .04, 2.6);
  // --- Navoi's couplet: santur arpeggios, a bell as each line is written
  drone([38, 45], T.page + .2, T.end, .005);
  for (let k = 0; k < 9; k++) { const t = 76.6 + k*1.1; [62, 66, 69, 74].forEach((m, i) => santur(m + (k % 3 === 2 ? 12 : 0), t + i*.14, .028)); }
  [T.write1[0], T.write1[0] + 1.6, T.write2[0], T.write2[0] + 1.6].forEach((t, i) => bell([81, 79, 78, 74][i], t, .03, 2));
  seq([[77.2, 69, 1.4], [78.8, 70, .7], [79.5, 69, .9], [80.6, 67, 1.2], [82.0, 66, .7], [82.7, 63, .5], [83.2, 62, 2.2]], (t, m, d) => ney(m, t, d, .038));

  [[86.4, [50, 57, 62, 66, 69]], [88.9, [48, 55, 60, 63, 67]], [91.4, [43, 50, 55, 58, 62]], [93.9, [50, 57, 62, 66, 69, 74]]].forEach(([t, ch]) => ch.forEach((m, i) => oud(m, t + i*.1, .08)));
  seq([[86.8, 74, 1.2], [88.0, 72, .6], [88.6, 70, .6], [89.2, 69, 1.4], [91.6, 70, .6], [92.2, 69, .6], [92.8, 67, .6], [93.4, 66, .5], [94.0, 62, 2.6]], (t, m, d) => ney(m, t, d, .04));
  bell(86, 94.0, .035, 2.8); bell(81, 94.12, .025, 2.8);
}
